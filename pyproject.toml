[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclaw"
version = "1.9.0"
description = "Offline-first RAG server with graph-enforced security routing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    # pydantic-core is intentionally not pinned here: pydantic==2.13.4 hard-pins its
    # exact pydantic-core (2.46.4), and constraints.txt locks that same version. The
    # dep-guard D1 lock-step check reads the pair from constraints.txt, not pyproject.
    "chromadb==1.5.9",  # CVE-2026-45829 (Critical pre-auth RCE; no upstream patch). Risk accepted ONLY for local/offline air-gapped use via PersistentClient (embedded mode, path from config.yaml). No HttpClient, no trust_remote_code. See SECURITY.md + pip-audit workflow.
    "sentence-transformers==6.0.0",
    # huggingface_hub and starlette are imported directly by first-party source
    # (retrieval/embeddings.py, gate.py/harness/server.py) but were, until now,
    # only implicit transitives of sentence-transformers/fastapi respectively --
    # a resolver has no obligation to keep pulling them in just because a parent
    # happens to today. Pinned to the exact version a clean `pip install -c
    # constraints.txt` resolves under the pins above (verified 2026-08-02; torch
    # excluded from that resolution only because its CPU wheel index was
    # unreachable in the verifying sandbox -- torch shares no dependency with
    # either package, so the resolution is unaffected).
    "huggingface-hub==1.28.0",
    "starlette==1.6.0",
    "rank-bm25==0.2.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "numpy==1.26.4",
    "nltk==3.10.3",
    # tzdata is required on Windows (and any host without a system IANA database)
    # for zoneinfo to resolve IANA names such as America/New_York. Kept
    # unconditional so OpenTweet scheduling tests behave identically across platforms.
    "tzdata==2026.3",
    "langgraph==1.2.11",
    "langchain-core==1.6.0",
    # langgraph-sdk imports websockets.asyncio at graph import time; keep this direct
    # so legacy/no-deps paths cannot strand the app on websockets 12.x.
    "websockets==17.0.1",
]

[project.optional-dependencies]
# nemoguardrails' own base dependencies (not gated behind any of its extras)
# include fastembed, onnxruntime, and pandas. fastembed's documented default
# behavior is to fetch ONNX embedding models from a remote CDN on first use —
# real friction against CyClaw's offline-first, no-egress posture even though
# this extra is opt-in and policy.guardrails.enabled stays false by default.
# Installing it is a deliberate choice; nothing here constrains fastembed to
# a local-only embedder yet.
guardrails = [
    "nemoguardrails==0.24.0",
]
postgres = [
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
]
pgvector = [
    "pgvector==0.5.0",
]
mssql = [
    "pyodbc==5.3.0",
]
# Optional CEL sanitizer backend for Numbat monitor-only rules (issue #1128
# Slice B). Not in `full` because it is default-off and a local-only install
# should not carry an extra policy engine it will not use.
numbat-cel = [
    "cel-python==0.5.0",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # pytest>=8.2 requires pygments>=2.7.2; pin a patched release so a full
    # dependency resolve of this extra (e.g. `pip install -e ".[test]"` with no
    # -c constraints.txt) cannot land on 2.9.0 (PYSEC-2023-117 / PYSEC-2026-2987).
    # Must match the requirements-test.txt / constraints.txt pin.
    "pygments==2.21.0",
]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pytest-cov==7.1.0",
]
agentic-deepagents = [
    "deepagents==0.7.8",
    "langchain==1.3.17",
    "langchain-openai==1.6.0",
    # langchain-anthropic is a MANDATORY (non-extra) dependency of deepagents
    # 0.6.12, so installing this extra already pulls it. Pinned explicitly rather
    # than left floating in deepagents' own >=1.4.7,<2 range, because an unpinned
    # transitive defeats the exact-pin reproducibility constraints.txt exists for
    # -- and because the Claude cloud provider imports it directly.
    "langchain-anthropic==1.6.1",
    # deepagents 0.6.12 ALSO mandatorily requires langchain-google-genai, langsmith,
    # and wcmatch (verified against its PyPI Requires-Dist, not the package's own
    # docs, which are silent on this) -- these install unconditionally too, but
    # nothing in CyClaw imports them directly, so they are pinned in
    # constraints.txt only (reproducibility), not listed as extra entries here.
]
# Grok only. Deliberately a SEPARATE extra from agentic-deepagents so a local-only
# install never pulls a cloud SDK it will not use, and deliberately NOT part of
# `full` below, which is what CI and dev boxes install.
agentic-deepagents-cloud = [
    "langchain-xai==1.3.0",
]
full = [
    "cyclaw[postgres]",
    "cyclaw[pgvector]",
    "cyclaw[dev]",
    "cyclaw[test]",
    "cyclaw[agentic-deepagents]",
]
# Literally every optional extra, for exercising every gated feature in one
# install (manual smoke-testing, a from-scratch dev box). NOT what CI/dev boxes
# install -- that's `full` above, which deliberately excludes the two extras
# added here for the documented reasons on each: `guardrails` because
# fastembed's default remote-CDN model fetch cuts against the offline-first
# posture, `agentic-deepagents-cloud` because a machine that never touches
# cloud providers shouldn't carry their SDK. Choosing `all` opts into both.
all = [
    "cyclaw[full]",
    "cyclaw[guardrails]",
    "cyclaw[agentic-deepagents-cloud]",
    "cyclaw[numbat-cel]",
]

[project.scripts]
cyclaw-server = "gate:main"
cyclaw-mcp = "mcp_hybrid_server:main"
cyclaw-index = "retrieval.indexer:main"
cyclaw-metrics = "metrics:main"
cyclaw-clear-cache = "retrieval.clear_cache:main"
cyclaw-harness = "harness.server:main"
cyclaw-user = "utils.authn_cli:main"
cyclaw-gen-cert = "utils.gen_cert:main"

[tool.hatch.build.targets.wheel]
packages = ["utils", "retrieval", "llm", "schemas", "sync", "agentic", "guardrails", "harness", "telegram", "opentweet", "memory"]

[tool.hatch.build.targets.wheel.force-include]
"gate.py" = "gate.py"
"gate_ops.py" = "gate_ops.py"
"gate_auth.py" = "gate_auth.py"
"gate_memory.py" = "gate_memory.py"
"graph.py" = "graph.py"
"mcp_hybrid_server.py" = "mcp_hybrid_server.py"
"metrics.py" = "metrics.py"
"mcp_manifest.json" = "mcp_manifest.json"
"config.yaml" = "config.yaml"
"static" = "static"
"data" = "data"

[tool.hatch.build.targets.sdist]
include = [
    "gate.py", "gate_ops.py", "gate_auth.py", "gate_memory.py", "graph.py", "mcp_hybrid_server.py", "metrics.py",
    "mcp_manifest.json",
    "config.yaml", "constraints.txt", "environment.yml", "utils", "retrieval", "memory",
    "llm", "schemas", "static", "data", "sync", "agentic", "guardrails", "harness", "telegram", "opentweet", "powershell", "macos", "windows",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.',
]
markers = [
    "uses_shipped_execution_flag: test reads the real shipped EXECUTION_ENABLED value",
    "nemo_runtime: real nemoguardrails==0.24 engine tests (set CYCLAW_NEMO_RUNTIME=1)",
]

[tool.coverage.run]
source = ["gate", "gate_ops", "gate_auth", "gate_memory", "graph", "mcp_hybrid_server", "metrics", "llm", "retrieval", "utils", "sync", "agentic", "guardrails", "harness", "telegram", "opentweet", "memory"]
omit = ["tests/*", "*/test_*", "*/__pycache__/*", "agentic/fsconnect/*", "agentic/sqlconnect/*", "agentic/netconnect/*", "agentic/vendor/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".claude", "agentic/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "S"]
ignore = ["E501"]
per-file-ignores = { "tests/*" = ["S101", "S603", "S108", "F401", "I001", "S105", "F841", "B007", "C408", "F541", "B904", "E501"], "gate.py" = ["E402", "I001", "B008", "E501"], "gate_auth.py" = ["B008"], "graph.py" = ["E501"], "utils/personality.py" = ["S608"], "utils/authn_manager.py" = ["S608"], "agentic/__init__.py" = ["E402"], "guardrails/__init__.py" = ["E402"], "telegram/__init__.py" = ["E402"], "opentweet/__init__.py" = ["E402"], "sync/__init__.py" = ["E402"], "harness/server.py" = ["E402", "B008", "E501"] }

[tool.ruff.lint.isort]
known-first-party = ["utils", "retrieval", "llm", "schemas", "sync", "agentic", "guardrails", "harness", "telegram", "opentweet", "memory"]

[tool.mypy]
python_version = "3.12"
strict = true
