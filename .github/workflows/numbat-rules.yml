# Non-blocking Numbat rules-test against committed fixtures plus a live
# executor-jail run (#961 / #965). Pins CLI 0.2.0 (schema 0.3.0).
# Does not gate merges. Does not edit ci.yml.
name: Numbat rules fixture

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"

concurrency:
  group: numbat-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  numbat-rules-fixture:
    name: numbat rules test --fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install numbat 0.2.0 (linux amd64)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/numbat.tgz \
            https://github.com/perplexityai/numbat/releases/download/v0.2.0/numbat_0.2.0_linux_amd64.tar.gz
          echo "6513d8cec69ea4a55667b0a764b93b7cef8fe814c2ef9e2535aaf438f11f1548  /tmp/numbat.tgz" | sha256sum -c -
          tar -xzf /tmp/numbat.tgz -C /tmp
          sudo install -m 0755 /tmp/numbat /usr/local/bin/numbat
          numbat version

      - name: Known-bad fixture must hit required rules
        run: |
          numbat rules test \
            --fixture tests/fixtures/numbat/known-bad-events.ndjson \
            --expect exfil.curl_post_file \
            --expect secrets.read_private_key

      - name: Clean / jail fixture must produce zero hits
        run: |
          numbat rules test \
            --fixture tests/fixtures/numbat/clean-events.ndjson \
            --expect-none

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Live executor-jail events must produce zero hits
        env:
          NUMBAT: /usr/local/bin/numbat
          GROK_API_KEY: dummy
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          # --noconftest: tests/conftest.py imports retrieval.hybrid_search
          # (rank_bm25 / torch). This job only installs pytest+pyyaml.
          python -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3
          python -m pytest --noconftest \
            tests/test_numbat_rules_fixtures.py::test_executor_jail_live_events_have_zero_rule_hits \
            -q --tb=short
