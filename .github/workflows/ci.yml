# ==============================================================================
# CyClaw CI — Tests + Coverage + Reproducible Install Gate
# v2 hardening (June 2026):
#   - Exact pip pin ==26.1.2, not floating >=, across every job that upgrades it
#     (eliminates 4 pip CVEs in CI env per #71 analysis; exact pin keeps CI
#     reproducible rather than silently picking up whatever pip ships next)
#   - Explicit hermetic prepare (mkdirs, minimal soul.md, env var) cross-platform
#   - Real RAG smoke validates ChromaDB (version pinned in constraints.txt) + BM25 + RRF on committed corpus
#   - Coverage scoped to exercised modules only
#   - workflow-lint (actionlint + zizmor) and dependency-review added as
#     fast, no-heavy-deps first gates — this file's own YAML and any new
#     PR-introduced dependency get checked before the expensive matrix runs
#   - ollama-mock-smoke: a real-socket HTTP-server test of LocalLLMClient
#     against the OpenAI-compatible endpoint, complementing (not replacing)
#     tests/test_client.py's monkeypatched error-mapping/retry coverage
#   - real-repo-run-smoke (2026-08, docs/agentic/DEFERRED_WORK.md D1): a
#     real-socket, real-gh-subprocess, real-git-clone smoke of the
#     real-repo-run wiring, closing a gap the existing CLI contract tests
#     leave open by mocking every outer boundary in Python
#   - Aligns with v1.9.0 invariants (reproducible CI security gate, Python 3.12, stable Chroma pin)
#   - Cross-ref: cyclaw-advisor + python-development best practices for observable, testable CI
# ==============================================================================

name: CyClaw CI (Tests + Coverage + Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs: when new commits are pushed to the same PR/branch,
# in-progress runs for that ref are cancelled instead of running to completion
# on stale code. Pushes to main are exempt (cancel-in-progress is false there)
# so every commit landed on main keeps full, uninterrupted CI history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fast, no-heavy-deps gates that run before the expensive matrix below.
  # Neither needs torch/chromadb/sentence-transformers, so both finish in
  # well under a minute on a cache hit.
  workflow-lint:
    name: workflow-lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install actionlint + zizmor (pinned, from PyPI -- not curl|bash)
        # actionlint-py's pip install fetches the prebuilt actionlint binary
        # from GitHub releases at build time and puts it on PATH as
        # `actionlint`; zizmor ships as a self-contained wheel, no fetch needed.
        run: python -m pip install actionlint-py==1.7.12.24 zizmor==1.28.0

      - name: Run actionlint
        # .github/workflows/environment.yml is a conda environment spec that
        # happens to live in this directory (referenced by
        # python-package-conda.yml), not a workflow file -- actionlint errors
        # trying to parse it as one ("jobs"/"on" section missing), so it's
        # passed the explicit file list rather than let scan the whole
        # directory by default.
        run: |
          for f in .github/workflows/*.yml; do
            [ "$(basename "$f")" = "environment.yml" ] && continue
            actionlint -color "$f"
          done

      - name: Run zizmor (Actions security static analysis)
        # Same environment.yml exclusion as actionlint above, but zizmor only
        # WARNs (not fails) on a file it can't parse as a workflow, so passing
        # the whole directory is fine here -- no need for the same file-list loop.
        # --gh-token enables the online audits (e.g. ref-version-mismatch's tag
        # lookup) that --offline would otherwise skip.
        #
        # --min-severity=high: an initial full run (offline + online) found 25
        # pre-existing medium/low findings scattered across ~10 files this PR
        # never touched (mostly missing persist-credentials: false on
        # read-only checkouts) -- fixing all of them needs per-job
        # verification that nothing downstream relies on the persisted
        # credential, which is real follow-up work, not something to block
        # every future PR on starting today. This still fails the build on
        # any HIGH-severity finding (the 2 that existed were already fixed
        # in this PR) -- run without the flag locally for the full picture.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --gh-token "$GH_TOKEN" --min-severity=high .github/workflows/

  invariant-guard:
    name: invariant-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run invariant-guard (blocking)
        # Static AST check over gate.py/gate_ops.py/graph.py/mcp_hybrid_server.py
        # -- stdlib-only, no torch/chromadb install needed (PyYAML is optional;
        # the script degrades to a text scan for G3 when it's absent), so this
        # is a fast, non-flaky gate that belongs beside workflow-lint above,
        # not inside the verify-skills matrix below. That matrix also runs
        # invariant-guard's verify.sh, but the whole matrix job carries
        # `continue-on-error: true` for genuinely flaky app-runtime e2e smokes
        # (index build + live uvicorn) -- invariant-guard shared that
        # non-blocking umbrella by accident, not by design, and was never a
        # real gate on the six invariants it exists to enforce.
        run: python3 .claude/skills/invariant-guard/check_invariants.py

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # chromadb's pre-auth code-injection advisory is risk-accepted for CyClaw's
          # embedded PersistentClient: the HTTP server surface that carries the RCE is
          # never instantiated (docs/THREAT_MODEL.md: "No HTTP DB"). This is the SAME
          # acceptance already encoded in .osv-scanner.toml (GHSA-f4j7-r4q5-qw2c /
          # PYSEC-2026-311) and pip-audit.yml (--ignore-vuln CVE-2026-45829) -- all
          # aliases of one advisory. dependency-review was the one gate still missing
          # it, so it failed on every PR that touches chromadb's pin. Allow-list the
          # single documented GHSA only; every other high/critical advisory (including
          # any future chromadb CVE) still fails this gate. See SECURITY.md.
          allow-ghsas: GHSA-f4j7-r4q5-qw2c

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Bound every run: the install step pulls torch + chromadb + sentence-transformers
    # and the RAG smoke spins up an embedded ChromaDB. A hung download or a wedged
    # service should fail fast, not idle until GitHub's 6-hour default and burn
    # Actions minutes on both OS legs of the matrix.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is GitHub's Apple Silicon (arm64) runner. Every step
        # except torch installation uses `shell: bash` uniformly across all
        # three OSes; torch gets its own macOS-specific install step (below)
        # because torch==2.13.0+cpu 404s on https://download.pytorch.org/whl/cpu
        # for macOS -- confirmed on this matrix leg's first run, and documented
        # in docs/HARNESS_MACOS.md.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: macOS install-script smoke test (layout + shim + profile integration)
        if: runner.os == 'macOS'
        # Exercises macos/install-cyclaw.sh's and uninstall-cyclaw.sh's own shell
        # logic -- the one part of the macOS/Linux harness port with no CI coverage
        # at all (confirmed: no workflow file anywhere references install-cyclaw.sh
        # or uninstall-cyclaw.sh). Placed here, before "Setup Python 3.12", because
        # install-cyclaw.sh is self-contained -- it clones its own repo copy and
        # builds its own venv -- so it has zero dependency on anything below and
        # testing it first keeps it isolated from the rest of this job's Python
        # setup. --skip-python-deps keeps it fast (venv/pip correctness is already
        # covered by "Install deps (macOS)" below); the PATH/profile rc-file edits
        # are deliberately NOT skipped, since exercising them is the point.
        #
        # HOME is overridden to a throwaway dir for the whole step so this can never
        # touch the real runner home or any later step -- required even though
        # nothing downstream today sources a shell rc file, because
        # install-cyclaw.sh's detect_rc_file()/`touch "$RC_FILE"` runs
        # UNCONDITIONALLY, before the --no-path-edit/--no-profile-edit checks (which
        # this test doesn't pass anyway, since it needs those code paths to run).
        #
        # continue-on-error matches this repo's own convention for a new/unproven
        # smoke path (verify-skills, below) -- the authoritative gate for this OS
        # leg stays "Run tests + coverage".
        continue-on-error: true
        shell: bash
        env:
          HOME: ${{ runner.temp }}/cyclaw-smoke-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          echo "[smoke] isolated HOME=$HOME"
          fail() { echo "[smoke] FAIL: $1" >&2; exit 1; }

          # --repo-path points the installer at THIS PR's own checkout instead of
          # cloning origin/main -- without it the smoke test would silently
          # validate main forever, never the branch under test.
          bash macos/install-cyclaw.sh --repo-path "$GITHUB_WORKSPACE" --skip-python-deps < /dev/null

          [ -d "$HOME/.CyClaw" ] || fail "home directory not created"
          # NOT "repo" -- that dir is only created on the clone path; --repo-path
          # points REPO_DIR straight at the external checkout instead (verified
          # against the script's own home-layout loop).
          for d in bin sessions skills tools memory; do
            [ -d "$HOME/.CyClaw/$d" ] || fail "missing \$HOME/.CyClaw/$d"
          done
          [ -x "$HOME/.CyClaw/bin/cyclaw" ] || fail "cyclaw shim missing or not executable"
          grep -qF "$GITHUB_WORKSPACE" "$HOME/.CyClaw/bin/cyclaw" \
            || fail "shim does not reference the checked-out repo (--repo-path not honored)"

          # NOT hardcoded to .zshrc: verified against a live macos-latest run that
          # $SHELL in this non-interactive Actions context does not match the
          # */zsh case in install-cyclaw.sh's own detect_rc_file() (it wrote
          # .bashrc instead) -- a real gap between "macOS's interactive-login
          # default shell" and "this CI runner's $SHELL env var", caught by this
          # smoke test failing for real on its first run. Discover whichever file
          # actually got the block instead of assuming which one detect_rc_file()
          # would pick.
          RC_FILE=""
          for candidate in "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.bashrc"; do
            if [ -f "$candidate" ] && grep -qF "# >>> cyclaw harness path >>>" "$candidate"; then
              RC_FILE="$candidate"
              break
            fi
          done
          # The discovery loop above already proved the PATH block is present
          # (that's its match condition) -- only the function block is a genuinely
          # independent assertion here.
          [ -n "$RC_FILE" ] || fail "no rc file (.zshrc/.bash_profile/.bashrc) contains the PATH block"
          grep -qF "# >>> cyclaw harness >>>" "$RC_FILE" || fail "cyclaw() function block missing from rc file"
          echo "[smoke] install-cyclaw.sh: layout + shim + profile integration OK"

          bash macos/uninstall-cyclaw.sh < /dev/null
          grep -qF "# >>> cyclaw harness path >>>" "$RC_FILE" && fail "PATH block survived uninstall"
          grep -qF "# >>> cyclaw harness >>>" "$RC_FILE" && fail "cyclaw() block survived uninstall"
          [ -d "$HOME/.CyClaw" ] || fail "uninstall must keep ~/.CyClaw by default (no --remove-home passed)"
          echo "[smoke] uninstall-cyclaw.sh: profile blocks removed, data kept OK"

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          # Key the pip download cache to the dependency manifests. When these are
          # unchanged, pip restores wheels (incl. the heavy torch/chromadb/
          # sentence-transformers downloads) from cache instead of re-fetching --
          # the biggest win on the slower windows-latest leg. Conservative: this
          # only caches the pip download dir, so a stale/missing cache degrades to
          # a normal install, never a broken one.
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml

      - name: Upgrade pip (CVE mitigation for CI env only)
        shell: bash
        run: |
          python -m pip install --upgrade "pip==26.1.2"

      - name: Cache torch CPU wheel
        if: runner.os != 'macOS'
        # Torch (~2GB) is pinned infrequently; caching its wheel separately means
        # a requirements.txt or constraints.txt change only busts the lighter
        # runtime-deps cache (via the setup-python pip cache), not this one.
        # The wheel is downloaded once per (os, pin) pair and reused on every
        # subsequent run until the pin changes in pyproject.toml. macOS skips
        # this cache entirely -- see the macOS-specific install step below.
        id: torch-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .torch-wheels
          key: torch-cpu-2.13.0-${{ runner.os }}-py312
          restore-keys: |
            torch-cpu-2.13.0-${{ runner.os }}-

      - name: Download torch wheel (cache miss only)
        if: runner.os != 'macOS' && steps.torch-wheel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # CVE-2025-32434 (weights_only=True RCE bypass) was fixed in torch 2.6.0.
          # 2.13.0 is within the patched range. --no-deps avoids pulling the default
          # CUDA build; only the CPU wheel is fetched and cached.
          pip download "torch==2.13.0+cpu" \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps -d .torch-wheels

      - name: Install deps (torch CPU + project + test tools)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          # Install torch from the per-version local wheel (no network fetch when
          # cache hits). --no-index / --find-links keeps pip from querying the
          # PyTorch index on cache-hit runs, speeding up the step significantly.
          pip install --no-index --no-deps --find-links .torch-wheels "torch==2.13.0+cpu"
          pip install -r requirements.txt -c constraints.txt pytest pytest-cov

      - name: Install deps (macOS -- plain torch, no +cpu suffix)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Confirmed via this matrix leg's first run: torch==2.13.0+cpu 404s on
          # https://download.pytorch.org/whl/cpu for macOS -- that index lists
          # plain (non "+cpu"-suffixed) versions there instead, because Apple
          # Silicon has no separate CPU/CUDA build to disambiguate (this was
          # flagged as an unverified gap in docs/HARNESS_MACOS.md; this is the
          # fix it named). requirements.txt/constraints.txt both hardcode the
          # +cpu pin by design (dependency-confusion-proof reproducibility on
          # Linux/Windows), so this leg installs plain torch directly, then
          # everything else from copies of both manifests with the torch/
          # extra-index-url lines stripped -- so pip never tries to reconcile
          # the installed plain build against the +cpu-suffixed pin.
          pip install "torch==2.13.0"
          grep -v -e '^torch==' -e '^--extra-index-url https://download.pytorch.org' requirements.txt > /tmp/requirements-macos.txt
          grep -v '^torch==' constraints.txt > /tmp/constraints-macos.txt
          pip install -r /tmp/requirements-macos.txt -c /tmp/constraints-macos.txt pytest pytest-cov

      - name: Prepare hermetic test env
        shell: bash
        run: |
          # data/corpus/cyclaw_overview.md is committed — the RAG smoke test indexes it.
          # Minimal soul.md + env var for gate tests. No prod secrets.
          mkdir -p data/personality index logs
          echo '# Soul' > data/personality/soul.md
          echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"

      - name: Cache embeddings model (sentence-transformers)
        # retrieval/embeddings.py fetches models.embeddings.model (all-MiniLM-L6-v2,
        # ~90MB) from HuggingFace on first use into cache_dir (config.yaml:
        # models.embeddings.cache_dir, ".emb_cache" relative to repo root) -- no
        # prior step seeds it, so every run re-downloads it fresh. That's the one
        # real external network fetch this job's RAG smoke step depends on;
        # caching it removes the repeat download and narrows exposure to the kind
        # of transient fetch failure that surfaced as a one-off CyClaw Conda CI
        # red X during a multi-PR merge landing on 2026-07-27 (a rerun and the
        # very next push both came back clean, pointing at a transient fetch, not
        # a code regression).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .emb_cache
          key: emb-model-${{ hashFiles('config.yaml') }}
          restore-keys: |
            emb-model-

      - name: RAG Query Smoke (ChromaDB + BM25 + RRF)
        shell: bash
        run: |
          # Validates full retrieval path against committed corpus.
          # Fails CI if min_score gate or hybrid fusion broken.
          # (Unit tests + coverage run in the next step.)
          python -m tests.ci_rag_smoke

      - name: Run tests + coverage
        shell: bash
        run: |
          # tests/ glob auto-discovers all test_*.py files — new test files are
          # picked up without a manual ci.yml edit. ci_rag_smoke.py is excluded
          # by pytest's default discovery pattern (it doesn't match test_*.py)
          # and runs separately in the RAG smoke step above.
          pytest tests/ \
            -q --tb=short \
            --cov=gate \
            --cov=gate_ops \
            --cov=utils.auth \
            --cov=utils.sanitizer \
            --cov=utils.telemetry_kill \
            --cov=utils.config_validation \
            --cov=utils.errors \
            --cov=utils.logger \
            --cov=utils.personality \
            --cov=utils.personality_db \
            --cov=utils.ratelimit \
            --cov=utils.health \
            --cov=utils.ops_runner \
            --cov=utils.guardrail_bridge \
            --cov=utils.selftest \
            --cov=llm.client \
            --cov=graph \
            --cov=retrieval.embeddings \
            --cov=retrieval.hybrid_search \
            --cov=retrieval.indexer \
            --cov=retrieval.stemmer \
            --cov=retrieval.vector_store \
            --cov=retrieval.clear_cache \
            --cov=mcp_hybrid_server \
            --cov=metrics \
            --cov=sync.selftest \
            --cov=sync.runner \
            --cov=sync.config \
            --cov=sync.filters \
            --cov=sync.cli \
            --cov=sync.scheduler \
            --cov=agentic \
            --cov=guardrails \
            --cov=harness \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Final status
        run: echo "CI workflow completed on ${{ matrix.os }} (reproducible gate passed)"

  # Real-socket smoke for LocalLLMClient against a mock OpenAI-compatible
  # Ollama endpoint. tests/test_client.py already covers every error-mapping/
  # retry branch via a monkeypatched httpx.Client.post (real Request/Response
  # objects, no real socket) -- this exercises the actual wire protocol (JSON
  # bytes over a real loopback TCP connection) instead. No torch/chromadb/
  # sentence-transformers needed: llm/client.py only imports httpx + yaml.
  ollama-mock-smoke:
    name: ollama-mock-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install ollama-mock-smoke test deps (no torch/chromadb needed)
        # pytest always imports tests/conftest.py regardless of which test file
        # is targeted, and conftest.py imports retrieval.hybrid_search -> rank_bm25
        # at module load time -- rank-bm25/nltk/numpy are required even though
        # this specific test file never touches retrieval. Same minimal set
        # postgres-backend already installs for the identical reason.
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          pip install -c constraints.txt httpx pyyaml pytest rank-bm25 nltk numpy

      - name: Run LocalLLMClient real-socket tests
        run: pytest tests/test_llm_client_ollama.py -v --tb=short

      - name: Final status
        run: echo "Ollama mock verification completed (llm.client OpenAI-compatible path, real socket)"

  # Real-socket, real-gh-subprocess, real-git-clone smoke for the real-repo-run
  # wiring. tests/test_agentic_real_repo_run_cli.py already covers this
  # command's contract exhaustively, but mocks all three of its outer
  # boundaries in Python (agentic.context.run_read, repo_workspace.run_read,
  # LocalProposerClient.invoke) -- none of them ever touch a real socket, a
  # real gh subprocess, or a real timeout. An emulated rehearsal found two
  # real defects in exactly that gap (planner timeout never reaching the
  # model client; ops_runner's ceiling not scaling with it once it did) that
  # were invisible to every existing test for the same reason. See
  # docs/agentic/DEFERRED_WORK.md D1 for the full design rationale. Same
  # no-torch/chromadb reasoning as ollama-mock-smoke above: agentic/ never
  # imports retrieval/gate/graph (invariant I6).
  real-repo-run-smoke:
    name: real-repo-run-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install real-repo-run-smoke test deps (no torch/chromadb needed)
        # Same minimal set ollama-mock-smoke installs, for the same reason
        # (conftest.py imports retrieval.hybrid_search -> rank_bm25 at module
        # load time regardless of which test file is targeted). Verified by
        # reading every module on the --repo (local-model) real-repo-run call
        # path's own import list -- none needs anything beyond this set; the
        # cloud-provider path (langchain_core et al.) is lazily imported only
        # inside cmd_real_repo_run's `if provider:` branch, which this smoke
        # test's --repo (no --provider) invocation never reaches.
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          pip install -c constraints.txt httpx pyyaml pytest rank-bm25 nltk numpy

      - name: Run real-repo-run smoke test
        run: pytest tests/test_agentic_real_repo_run_smoke.py -v --tb=short

      - name: Final status
        run: echo "real-repo-run smoke verification completed (real socket, real gh subprocess, real git clone)"

  # Optional Deep Agents contract check. This deliberately installs only the
  # lightweight agentic dependency set; default runtime CI remains offline-first.
  deepagents-harness:
    name: deepagents-harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install optional Deep Agents harness dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          pip install -c constraints.txt pyyaml httpx langgraph langchain-core pytest pytest-asyncio rank-bm25
          pip install -c constraints.txt deepagents langchain-openai langchain-xai

      - name: Verify Deep Agents HITL and fixture runner
        run: |
          pytest tests/test_agentic_harness_phase679.py tests/test_agentic_deepagent_optional.py \
            tests/test_agentic_cloud_chat_model_wire_format.py -q --tb=short

      - name: Audit optional Deep Agents dependencies (freeze, not hand-written)
        # Captures the versions actually resolved/installed above rather than a
        # hardcoded string -- a hand-maintained version list here would be the
        # same class of silent-drift risk dep-guard's D8 check exists to catch
        # for torch (a bumped constraints.txt pin wouldn't update a hardcoded
        # copy elsewhere, so pip-audit would keep auditing a version nobody runs).
        # The alternation was previously '(deepagents|langchain|langchain-openai)=='
        # which required '==' immediately after the token, so every other
        # langchain-* distribution -- langchain-anthropic and langchain-google-genai
        # (both MANDATORY deps of deepagents), plus langsmith and now langchain-xai
        # -- was installed but never audited.
        run: |
          pip install pip-audit
          pip freeze | grep -Ei '^(deepagents|langchain|langchain-[a-z0-9-]+|langsmith)==' > /tmp/deepagents-requirements.txt
          cat /tmp/deepagents-requirements.txt
          pip-audit -r /tmp/deepagents-requirements.txt

  # ==============================================================================
  # Postgres backend job (opt-in DB paths)
  # Exercises the LIVE psycopg/pgvector connect+execute paths that the default
  # matrix can only skip: the soul DB over Postgres, the rate limiter over
  # Postgres, and the pgvector vector store. Ubuntu-only — service containers do
  # not run on the windows-latest leg. Uses pgvector/pgvector:pg16 (a superset of
  # postgres:16 that ships the `vector` extension). Lean deps: torch / chromadb /
  # sentence-transformers / fastapi stay lazy and are not needed; the job installs
  # only the import-time deps the shared tests/conftest.py pulls in (rank-bm25 + nltk
  # via retrieval.hybrid_search) plus the Postgres drivers. sslmode=disable because
  # the service is a trusted same-host container.
  # ==============================================================================
  postgres-backend:
    name: postgres-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Digest-pinned (resolved 2026-07-21), same rationale as the uv image
        # pin in the Dockerfile: a re-tagged/compromised :pg16 image would
        # otherwise silently enter this job. Trade-off: this image stops
        # picking up Postgres security patches automatically -- re-pin the
        # digest periodically (`docker manifest inspect pgvector/pgvector:pg16`
        # or the registry API) rather than letting it go stale indefinitely.
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: cyclaw
          POSTGRES_PASSWORD: cyclaw
          POSTGRES_DB: cyclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Loopback DSN for the ephemeral CI service container, not debug code.
      CYCLAW_DB_URL: postgresql://cyclaw:cyclaw@127.0.0.1:5432/cyclaw  # DevSkim: ignore DS162092
      CYCLAW_DB_SSLMODE: disable
      GROK_API_KEY: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Upgrade pip (CVE mitigation for CI env only)
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install Postgres-backend deps
        run: |
          # Postgres drivers + the import-time deps tests/conftest.py needs
          # (retrieval.hybrid_search → rank-bm25, nltk; numpy backs rank-bm25).
          # Constraints pin psycopg/psycopg-binary 3.2.13, pgvector 0.4.2, and the
          # rest to the project versions. PorterStemmer needs no nltk_data download.
          pip install -c constraints.txt 'psycopg[binary]' pgvector pyyaml rank-bm25 nltk numpy pytest

      - name: Run live Postgres / pgvector backend tests
        run: |
          pytest \
            tests/test_personality_postgres.py \
            tests/test_ratelimit_postgres.py \
            tests/test_pgvector_store.py \
            -q --tb=short

      - name: Final status
        run: echo "Postgres backend tests passed (soul DB + rate limiter + pgvector)"

  # ==============================================================================
  # Skill verification matrix (new in feature/CyClaw-Agent)
  # Runs every .claude/skills/*/verify.sh and smoke.sh in parallel.
  # This enforces that all skills (including new agentic/memory ones) stay
  # healthy and respect the governance invariants.
  # ==============================================================================
  # A matrix cannot reference a step output from its own job (the matrix is
  # evaluated before any step runs). Correct pattern: a discover job emits the
  # skill list as an output, then the matrix job consumes it via `needs`.
  discover-skills:
    name: discover-skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.discover.outputs.skills }}
      has_skills: ${{ steps.discover.outputs.has_skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Discover skills with verify/smoke scripts
        id: discover
        run: |
          SKILLS=$(find .claude/skills -maxdepth 1 -mindepth 1 -type d | while read -r d; do
            if [ -f "$d/verify.sh" ] || [ -f "$d/smoke.sh" ]; then
              basename "$d"
            fi
          done | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          if [ "$SKILLS" = "[]" ]; then
            echo "has_skills=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_skills=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Discovered skills: $SKILLS"

  verify-skills:
    name: verify-skills (${{ matrix.skill }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deliberately runs IN PARALLEL with `test` (needs only discover-skills).
    # A `needs: test` serialization was tried (2026-07-17) to guarantee this
    # matrix always finds a warm torch-wheel cache, and reverted the same day
    # on measured data: workflow wall-clock went from ~4.2 min to ~8.9 min
    # (all 9 matrix jobs were created the exact second the slower
    # windows-latest test leg finished, then added ~3.8 min of their own),
    # while on warm-cache runs — which is nearly every run — each matrix job
    # restores the wheel independently in 1-4 seconds anyway. The only thing
    # serialization bought was avoiding parallel re-downloads on a cold key
    # (torch pin bump / 7-day eviction), which costs bandwidth GitHub-hosted
    # runners don't meter, not wall time. Do not re-add `needs: test` without
    # new measurements showing the trade has changed.
    needs: discover-skills
    # Skip cleanly when no skill ships a verify/smoke script (empty matrix).
    if: needs.discover-skills.outputs.has_skills == 'true'
    # These skill scripts are full app-runtime e2e smokes (they build the index
    # and launch the uvicorn server), not lightweight self-tests. They are run
    # with the full environment below, but kept NON-BLOCKING (continue-on-error):
    # the authoritative pass/fail gate is the `test` job's unit suite + RAG smoke.
    # This surfaces runtime regressions as a visible signal without gating merges
    # on environment-heavy e2e that can be flaky on shared runners.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover-skills.outputs.skills) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml

      - name: Cache torch CPU wheel
        # Same cache the `test` job uses (identical key): without it every leg of
        # this skill matrix re-downloaded the ~2 GB torch wheel from the PyTorch
        # index on every run — N legs × 2 GB of avoidable network per push.
        id: torch-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .torch-wheels
          key: torch-cpu-2.13.0-${{ runner.os }}-py312
          restore-keys: |
            torch-cpu-2.13.0-${{ runner.os }}-

      - name: Download torch wheel (cache miss only)
        if: steps.torch-wheel-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip download "torch==2.13.0+cpu" \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps -d .torch-wheels

      - name: Install deps (torch CPU + project)
        shell: bash
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          pip install --no-index --no-deps --find-links .torch-wheels "torch==2.13.0+cpu"
          pip install -r requirements.txt -c constraints.txt
          # Some skill scripts invoke `python3.12` explicitly; ensure it resolves.
          command -v python3.12 >/dev/null 2>&1 || sudo ln -sf "$(command -v python)" /usr/local/bin/python3.12

      - name: Prepare hermetic env
        shell: bash
        run: |
          # NOTE: do not stub soul.md here. The committed data/personality/soul.md
          # is the real artifact, and skill verify scripts (e.g.
          # sandbox-runtime-verification/verify.sh) back it up, stub it for an
          # early stage, then restore the real file before launching the server.
          # Overwriting it with a 7-char '# Soul' stub here means verify.sh backs
          # up the stub and "restores" 7 chars, so /soul returns near-empty text
          # and the terminal.html emulation's non-empty soul assertion fails.
          mkdir -p data/personality index logs
          echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"
          # CYCLAW_API_KEY needed for GET /soul smoke check (now auth-gated).
          # This is a non-secret CI smoke value — loopback-only, ephemeral.
          echo 'CYCLAW_API_KEY=smoke-test-key-ci' >> "$GITHUB_ENV"

      - name: Run verify.sh if present
        if: hashFiles(format('.claude/skills/{0}/verify.sh', matrix.skill)) != ''
        # SKILL routed through env rather than interpolated into the run
        # script: matrix.skill is a directory name under .claude/skills/, and
        # while today those are maintainer-controlled, template-expanding it
        # directly into shell text would let a directory named with shell
        # metacharacters execute as code instead of just being read as a
        # string once it reaches "$SKILL" (zizmor template-injection).
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          echo "Running verify for $SKILL"
          bash ".claude/skills/$SKILL/verify.sh"

      - name: Run smoke.sh if present
        if: hashFiles(format('.claude/skills/{0}/smoke.sh', matrix.skill)) != ''
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          echo "Running smoke for $SKILL"
          bash ".claude/skills/$SKILL/smoke.sh"
