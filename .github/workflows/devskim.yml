# .github/workflows/devskim.yml
#
# Static security scan with Microsoft DevSkim
# Tailored for CGFixIT/CyClaw (Python project with Poetry)

name: "DevSkim – CyClaw"

on:
  push:
    branches: [ "main", "dev", "release/**" ]
  pull_request:
    branches: [ "main", "dev", "release/**" ]
  schedule:
    # Every Sunday at 03:11 UTC
    - cron: "11 3 * * 0"

permissions:
  contents: read          # checkout
  security-events: write  # upload SARIF

# Cancel superseded in-progress runs on the same branch to save CI minutes;
# pushes to main are exempt so main keeps a complete scan history.
concurrency:
  group: devskim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  devskim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Optional: set up Python & install deps so DevSkim understands imports
      # No `cache: "pip"` here on purpose: this job runs on `pull_request`
      # (including branches whose diff this job doesn't otherwise gate) *and*
      # on `schedule`/`push` to main. A pip cache written by an untrusted PR
      # run and later restored by the trusted scheduled/main run is a cache-
      # poisoning vector (zizmor `cache-poisoning`, high severity) — this job
      # isn't hot-path CI re-run dozens of times an hour, so the cache's
      # performance win doesn't justify carrying that risk.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project dependencies (Poetry or requirements.txt)
        run: |
          python -m pip install --upgrade pip
          # CyClaw quirk (CLAUDE.md § Dependency Notes): install CPU-only torch
          # BEFORE requirements.txt, otherwise Linux pulls the multi-GB CUDA
          # wheel. Mirrors ci.yml so DevSkim's import-resolution env matches CI.
          pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if [ -f poetry.lock ]; then
            pip install poetry
            poetry install --no-root --no-interaction --no-ansi
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt -c constraints.txt
          else
            echo "No dependency file found – continuing without install."
          fi

      # Run DevSkim
      - name: Run DevSkim scanner
        id: devskim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6  # v1
        with:
          # Scan the whole workspace. The action's default `directory-to-scan` is
          # GITHUB_WORKSPACE, so it is omitted here.
          #
          # The previous config used `directory:`, `output:`, `severity:`, and
          # `ignore-files:` — none of which are valid DevSkim-Action@v1 inputs.
          # The action silently ignored them (see the "Unexpected input(s)"
          # warning in earlier run logs) and fell back to scanning the whole repo
          # with defaults anyway. These are the correct input names; the effective
          # behavior (whole-repo scan, inline `# DevSkim: ignore <rule>`
          # suppressions honored) is unchanged.
          #
          # NOTE: DevSkim-Action@v1 has no `severity` input — severity gating was
          # never actually applied. The job's pass/fail is driven by the SARIF
          # upload + code-scanning alert creation below, which is the intended
          # security behavior.
          output-filename: devskim-results.sarif
          # DS137138/DS162092: loopback-only binding/hardcoded-IP findings --
          # CyClaw's threat model is loopback-only by design (docs/THREAT_MODEL.md),
          # so these fire throughout on purpose; each true instance also carries an
          # inline `# DevSkim: ignore` with a design rationale (see gate.py, harness/
          # server.py, tests/conftest.py, etc.) -- excluded here to stop the alert
          # noise on every one of those already-justified sites.
          #
          # DS106863 ("Do not use the DES symmetric block cipher") is a BARE,
          # case-insensitive, zero-word-boundary substring match on "DES" -- not a
          # real cipher-usage detector. It fires on any code containing
          # description/design/destructive/degrades/nodes/codes/modes/dest/etc.
          # A repo-wide check found the substring in 113 of 199 .py files (57%).
          # Confirmed via tests/test_agentic_registry_contract.py (PR #699,
          # 2026-07-29): a schema dict with a "description" field tripped this rule
          # three separate times as different lines were touched, none of them
          # anywhere near cryptography. Checked: no `DES.new(`, `Cipher.DES`,
          # `algorithms.DES`/`TripleDES`, or any crypto-library DES import exists
          # anywhere in this codebase -- this exclusion turns off noise, not a
          # real detector for an API surface CyClaw doesn't use.
          exclude-rules: 'DS137138,DS162092,DS106863'
          ignore-globs: "**/.git/**,**/bin/**,**/*.md,**/*.json"

      # Upload SARIF to GitHub Security tab
      - name: Publish findings to Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          sarif_file: devskim-results.sarif

      # Also keep the SARIF as a downloadable run artefact (optional)
      - name: Save SARIF artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: devskim-results
          path: devskim-results.sarif
