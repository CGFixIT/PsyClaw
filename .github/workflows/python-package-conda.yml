name: CyClaw Conda CI 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # security-events: write removed — CodeQL is owned by codeql.yml; no
  # duplicate scan here means this workflow needs no SARIF-upload permission.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # match sandbox 3.12 + modern invariants

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false

    - name: Setup Miniconda + mamba (fast solver)
      uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
      with:
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: strict
        activate-environment: cyclaw
        environment-file: environment.yml
        auto-activate-base: false
        use-mamba: true

    # No conda cache step here on purpose. The one removed in this PR sat AFTER
    # "Setup Miniconda + mamba" above, so its restore always landed on an
    # already-solved environment -- the mamba solve was paid in full on every
    # run and only the post-job save did anything, uploading a multi-GB env to
    # the repo's shared Actions cache for nothing. Re-adding caching here means
    # doing it the way setup-miniconda documents (a CONDA_PKGS_DIRS package
    # cache declared before the setup step), not moving this block up: with
    # miniforge-version: latest the install root is not necessarily the
    # /home/runner/miniconda3 path the old step named. Left as follow-up rather
    # than guessed at.

    - name: Install CyClaw in editable mode + test extras
      shell: bash -l {0}
      run: |
        python -m pip install -e ".[test,dev]" --no-deps
        # If heavy deps live in environment.yml, they are already resolved by mamba

    - name: Prepare hermetic test env
      shell: bash -l {0}
      run: |
        mkdir -p data/personality index logs
        echo '# Soul' > data/personality/soul.md
        echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"

    - name: Cache embeddings model (sentence-transformers)
      # See ci.yml's identical step for the full rationale: this job's
      # verify.sh (CyClaw-Sandbox) Stage 3 builds a real index via
      # retrieval.indexer, which fetches models.embeddings.model from
      # HuggingFace into .emb_cache on first use. Caching it here removes that
      # repeat network fetch on every run.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .emb_cache
        key: emb-model-${{ hashFiles('config.yaml') }}
        restore-keys: |
          emb-model-

    - name: Pytest — unit + integration + safe smoke (RAG/policy focused)
      shell: bash -l {0}
      run: |
        pytest tests/ \
          -v \
          --cov=gate \
          --cov=gate_ops \
          --cov=graph \
          --cov=mcp_hybrid_server \
          --cov=metrics \
          --cov=llm \
          --cov=retrieval \
          --cov=utils \
          --cov=sync \
          --cov=agentic \
          --cov=guardrails \
          --cov=harness \
          --cov-report=xml \
          --cov-report=term-missing \
          --tb=short

    - name: Run verify harness / smoke (if present)
      shell: bash -l {0}
      run: |
        if [ -x ./verify.sh ]; then
          echo "Running project verify.sh harness..."
          ./verify.sh
        fi
        if [ -f .claude/skills/CyClaw-Sandbox/verify.sh ]; then
          echo "Running sandbox verification harness..."
          bash .claude/skills/CyClaw-Sandbox/verify.sh
        fi

    # CodeQL analysis is owned by .github/workflows/codeql.yml which runs on
    # every push/PR to main. A duplicate scan here would double billing and
    # upload a conflicting SARIF result to the same security tab. Removed.
