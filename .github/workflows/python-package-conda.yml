name: CyClaw Conda CI 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # security-events: write removed — CodeQL is owned by codeql.yml; no
  # duplicate scan here means this workflow needs no SARIF-upload permission.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # match sandbox 3.12 + modern invariants

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    # Env spec is repo-root environment.yml (NOT .github/workflows/environment.yml —
    # that path is a no-op placeholder after c708148; see that workflow's header).
    - name: Setup Miniconda + mamba (fast solver)
      uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
      with:
        # Pin the installer base (not "latest") so Miniforge itself is reproducible.
        # Matches the install-surface pin policy in ci.yml (pip==26.1.2).
        miniforge-version: "25.3.0-3"
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: strict
        activate-environment: cyclaw
        environment-file: environment.yml
        auto-activate-base: false
        use-mamba: true

    # NO conda-env cache here, deliberately. One lived at this exact point --
    # AFTER setup-miniconda above has already solved and built the env from
    # environment.yml -- so a restore could never save solve or install time;
    # it could only overlay a previous run's site-packages onto a freshly
    # built env. That mechanism caused three incidents (2026-07-30 pip 26.2's
    # get_runnable_pip ImportError wedging every branch including main, since
    # restore-keys re-selected the poisoned blob on every re-run; then the -v3
    # blob going bad the same way on 2026-08-22), and each fix was a new cache
    # generation plus more healing code rather than removal. A cache that can
    # only ever hurt is not a cache. If conda-env caching is wanted later it
    # must be restored BEFORE setup-miniconda, keyed on environment.yml, with
    # setup-miniconda skipped on a hit -- a different design, not this one.
    - name: Pin pip in the conda env (matches ci.yml's exact pin)
      shell: bash -leo pipefail {0}
      run: |
        # Plain pin: with the overlay cache gone (see above) the env's pip is
        # always the coherent one mamba just installed, so the former
        # wipe-site-packages + ensurepip bootstrap -- which existed solely to
        # heal a cache-restored, half-upgraded pip -- has nothing left to heal.
        python -m pip install --upgrade "pip==26.1.2"
        python -m pip --version

    - name: Install CyClaw in editable mode + test extras
      shell: bash -leo pipefail {0}
      run: |
        python -m pip install -e ".[test,dev]" --no-deps
        # If heavy deps live in environment.yml, they are already resolved by mamba

    - name: Prepare hermetic test env
      shell: bash -leo pipefail {0}
      run: |
        mkdir -p data/personality index logs
        echo '# Soul' > data/personality/soul.md
        echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"

    - name: Cache embeddings model (sentence-transformers)
      # See ci.yml's identical step for the full rationale: this job's
      # verify.sh (CyClaw-Sandbox) Stage 3 builds a real index via
      # retrieval.indexer, which fetches models.embeddings.model from
      # HuggingFace into .emb_cache on first use. Caching it here removes that
      # repeat network fetch on every run.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .emb_cache
        key: emb-model-${{ hashFiles('config.yaml') }}
        restore-keys: |
          emb-model-

    - name: Pytest — unit + integration + safe smoke (RAG/policy focused)
      shell: bash -leo pipefail {0}
      run: |
        # --cov target list mirrored from ci.yml's "Run tests + coverage" step -- keep both in sync by hand (2 lanes, below the threshold where a shared/generated list earns its own tooling).
        pytest tests/ \
          -v \
          --cov=gate \
          --cov=gate_ops \
          --cov=gate_auth \
          --cov=gate_memory \
          --cov=memory \
          --cov=utils.agent_identity \
          --cov=utils.repo_paths \
          --cov=utils.auth \
          --cov=utils.authn \
          --cov=utils.authn_store \
          --cov=utils.authn_manager \
          --cov=utils.authn_cli \
          --cov=utils.gen_cert \
          --cov=utils.sanitizer \
          --cov=utils.telemetry_kill \
          --cov=utils.config_validation \
          --cov=utils.errors \
          --cov=utils.logger \
          --cov=utils.numbat_emitter \
          --cov=utils.spend \
          --cov=utils.sequence_detect \
          --cov=utils.mcp_manifest \
          --cov=utils.personality \
          --cov=utils.personality_db \
          --cov=utils.ratelimit \
          --cov=utils.health \
          --cov=utils.ops_runner \
          --cov=utils.external_pre_hook \
          --cov=utils.guardrail_bridge \
          --cov=utils.selftest \
          --cov=utils.launchd_plist \
          --cov=utils.win_schtasks \
          --cov=llm.client \
          --cov=graph \
          --cov=retrieval.embeddings \
          --cov=retrieval.hybrid_search \
          --cov=retrieval.indexer \
          --cov=retrieval.stemmer \
          --cov=retrieval.vector_store \
          --cov=retrieval.clear_cache \
          --cov=retrieval.results \
          --cov=mcp_hybrid_server \
          --cov=metrics \
          --cov=sync.selftest \
          --cov=sync.runner \
          --cov=sync.config \
          --cov=sync.filters \
          --cov=sync.cli \
          --cov=sync.scheduler \
          --cov=agentic \
          --cov=guardrails \
          --cov=harness \
          --cov=telegram \
          --cov=opentweet \
          --cov-report=xml \
          --cov-report=term-missing \
          --tb=short

    - name: Run verify harness (if present)
      shell: bash -leo pipefail {0}
      run: |
        if [ -x ./verify.sh ]; then
          echo "Running project verify.sh harness..."
          ./verify.sh
        fi

    # CyClaw-Sandbox's verify.sh is a full app-runtime e2e smoke (it builds
    # the index and launches the uvicorn server), not a lightweight self-test
    # -- the same shape .github/workflows/ci.yml's verify-skills matrix runs,
    # and that job is deliberately continue-on-error for the identical reason
    # stated there: it can be flaky on shared runners, and the authoritative
    # pass/fail gate for this job is the "Run unit tests" step above, not this
    # e2e smoke. Kept as its own step (rather than folded into the one above)
    # so ONLY this app-runtime smoke is advisory -- a project ./verify.sh, if
    # one is ever added, still gates normally.
    - name: Run sandbox verification harness (if present, non-blocking)
      shell: bash -leo pipefail {0}
      continue-on-error: true
      run: |
        if [ -f .claude/skills/CyClaw-Sandbox/verify.sh ]; then
          echo "Running sandbox verification harness..."
          bash .claude/skills/CyClaw-Sandbox/verify.sh
        fi

    # CodeQL analysis is owned by .github/workflows/codeql.yml which runs on
    # every push/PR to main. A duplicate scan here would double billing and
    # upload a conflicting SARIF result to the same security tab. Removed.
