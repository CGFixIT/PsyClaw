name: CyClaw Conda CI 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # security-events: write removed — CodeQL is owned by codeql.yml; no
  # duplicate scan here means this workflow needs no SARIF-upload permission.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # match sandbox 3.12 + modern invariants

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Miniconda + mamba (fast solver)
      uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
      with:
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: strict
        activate-environment: cyclaw
        environment-file: environment.yml
        auto-activate-base: false
        use-mamba: true

    - name: Cache conda environment
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          /home/runner/miniconda3/envs/cyclaw
          /home/runner/miniconda3/pkgs
        # The -v2 segment is a cache GENERATION marker, present in both the key
        # and the restore-keys prefix. On 2026-07-30 every PR in the repo started
        # failing here with:
        #
        #   ImportError: cannot import name 'get_runnable_pip'
        #       from 'pip._internal.utils.misc'
        #
        # i.e. a site-packages whose pip/_internal/build_env/installer.py and
        # pip/_internal/utils/misc.py came from DIFFERENT pip versions (pip 26.2
        # landed that morning). Because restore-keys matched on the bare
        # conda-<os>-<py>- prefix, every subsequent run -- on every branch, and on
        # main -- restored that same broken env, so re-running never recovered.
        # Bumping the generation is what actually evicts it: the poisoned entries
        # only match the old prefix, so they can never be selected again.
        key: conda-${{ runner.os }}-${{ matrix.python-version }}-v2-${{ hashFiles('environment.yml', 'pyproject.toml', '**/requirements*.txt') }}
        restore-keys: |
          conda-${{ runner.os }}-${{ matrix.python-version }}-v2-

    - name: Pin pip in the conda env (matches ci.yml's exact pin)
      shell: bash -l {0}
      run: |
        # Root cause of the cache poisoning above: this workflow was the only one
        # that never pinned pip, so the env drifted onto whatever pip PyPI shipped
        # next and a partial upgrade could leave it unimportable. ci.yml pins
        # pip==26.1.2 in every job for exactly this reproducibility reason; match it.
        #
        # ensurepip runs first as a self-heal: if a restored env ever does carry a
        # half-upgraded pip, `python -m pip` itself raises on import, so pip cannot
        # be used to repair pip. ensurepip reinstalls a coherent one from the
        # stdlib bundle without importing the broken copy. It is a no-op on a
        # healthy env, and '|| true' keeps a conda python that ships without the
        # ensurepip bundle from failing the job before the pin below gets its turn.
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade "pip==26.1.2"
        python -m pip --version

    - name: Install CyClaw in editable mode + test extras
      shell: bash -l {0}
      run: |
        python -m pip install -e ".[test,dev]" --no-deps
        # If heavy deps live in environment.yml, they are already resolved by mamba

    - name: Prepare hermetic test env
      shell: bash -l {0}
      run: |
        mkdir -p data/personality index logs
        echo '# Soul' > data/personality/soul.md
        echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"

    - name: Cache embeddings model (sentence-transformers)
      # See ci.yml's identical step for the full rationale: this job's
      # verify.sh (CyClaw-Sandbox) Stage 3 builds a real index via
      # retrieval.indexer, which fetches models.embeddings.model from
      # HuggingFace into .emb_cache on first use. Caching it here removes that
      # repeat network fetch on every run.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .emb_cache
        key: emb-model-${{ hashFiles('config.yaml') }}
        restore-keys: |
          emb-model-

    - name: Pytest — unit + integration + safe smoke (RAG/policy focused)
      shell: bash -l {0}
      run: |
        pytest tests/ \
          -v \
          --cov=gate \
          --cov=gate_ops \
          --cov=graph \
          --cov=mcp_hybrid_server \
          --cov=metrics \
          --cov=llm \
          --cov=retrieval \
          --cov=utils \
          --cov=sync \
          --cov=agentic \
          --cov=guardrails \
          --cov=harness \
          --cov=telegram \
          --cov-report=xml \
          --cov-report=term-missing \
          --tb=short

    - name: Run verify harness / smoke (if present)
      shell: bash -l {0}
      run: |
        if [ -x ./verify.sh ]; then
          echo "Running project verify.sh harness..."
          ./verify.sh
        fi
        if [ -f .claude/skills/CyClaw-Sandbox/verify.sh ]; then
          echo "Running sandbox verification harness..."
          bash .claude/skills/CyClaw-Sandbox/verify.sh
        fi

    # CodeQL analysis is owned by .github/workflows/codeql.yml which runs on
    # every push/PR to main. A duplicate scan here would double billing and
    # upload a conflicting SARIF result to the same security tab. Removed.
