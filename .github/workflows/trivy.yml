name: "Trivy Security Scan"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '45 4 * * 2'
  workflow_dispatch:

# Workflow-level grant stays read-only; the SARIF-upload permission is declared
# per-job below. zizmor's excessive-permissions audit flags a workflow-level
# `security-events: write` in a multi-job workflow because every future job
# inherits it silently -- see pr-template-check.yml for the same shape.
permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload-sarif
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          version: 'v0.72.0'
          # Passed explicitly rather than relying on Trivy's implicit cwd
          # discovery, so the suppressions still apply if this step ever gains
          # a working-directory. Contents mirror pip-audit.yml's --ignore-vuln
          # set; rationale + review dates live in .trivyignore and SECURITY.md.
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  docker-image:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload-sarif
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PRs that touch only docs/.claude material cannot affect the Docker image;
      # skip the expensive multi-GB torch build while leaving the filesystem scan
      # above unfiltered.
      - name: Detect image-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docker_changed=true" >> "$GITHUB_OUTPUT"
          else
            non_docs=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -vE '^(docs/|\.claude/)' || true)
            if [ -n "$non_docs" ]; then
              echo "docker_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "docker_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docker_changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # cache-to is deliberately NOT on this step -- see "Refresh build cache"
      # below. This step only needs to succeed at building + loading the image
      # for Trivy to scan; that must never depend on the cache EXPORT succeeding.
      - name: Build image
        if: steps.changes.outputs.docker_changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: cyclaw:ci
          cache-from: type=gha

      - name: Run Trivy image scanner
        if: steps.changes.outputs.docker_changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'cyclaw:ci'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          version: 'v0.72.0'
          # Same suppressions as the fs scan above: the image bundles the same
          # requirements.txt, so without this the accepted chromadb/nltk CVEs
          # are re-raised a second time under the trivy-image category.
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF
        if: always() && steps.changes.outputs.docker_changed == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # This repo's every open PR re-triggers this job (pull_request has no path
      # filter), so many docker-image runs across different PRs/branches can
      # build+cache this same Dockerfile concurrently. buildx's type=gha cache
      # export was observed failing outright ("failed to reserve cache") under
      # that concurrency -- confirmed empirically: the build step above always
      # completes and loads the image fine, only a COMBINED build+cache-export
      # step failed. Isolating the export into its own best-effort step (same
      # builder, so this rebuild hits BuildKit's local cache and is fast) means
      # a losing cache-export race can no longer fail the scan job above it.
      - name: Refresh build cache (best-effort)
        if: steps.changes.outputs.docker_changed == 'true'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
