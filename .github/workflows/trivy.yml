name: "Trivy Security Scan"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '45 4 * * 2'
  workflow_dispatch:

# Workflow-level grant stays read-only; the SARIF-upload permission is declared
# per-job below. zizmor's excessive-permissions audit flags a workflow-level
# `security-events: write` in a multi-job workflow because every future job
# inherits it silently -- see pr-template-check.yml for the same shape.
permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload-sarif
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          version: 'v0.72.0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  docker-image:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload-sarif
    env:
      # The legacy (v1) GitHub Actions cache service can fail a large gha-cache
      # export (this image's torch layer alone is ~360MB) with "failed to
      # reserve cache" / "error writing layer blob" -- a documented cache-API
      # limitation, not a build error. The v2 cache service fixes it; opt in
      # explicitly since it is not yet the default for every runner image.
      ACTIONS_CACHE_SERVICE_V2: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          load: true
          tags: cyclaw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'cyclaw:ci'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          version: 'v0.72.0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
