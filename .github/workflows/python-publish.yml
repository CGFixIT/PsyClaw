# Upload a Python package to PyPI when a GitHub Release is published.
# Actions are full-SHA-pinned (same policy as ci.yml / codeql.yml) so a
# compromised tag cannot rewrite the publish path. No extra secrets/keys
# beyond the trusted-publishing OIDC token.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Match requires-python / CI matrix (pyproject.toml: >=3.12).
          python-version: "3.12"
          # Deliberately no pip cache here (unlike numbat-rules.yml's
          # identical-looking addition): zizmor's cache-poisoning audit
          # flags caching on this release:published-triggered, PyPI-publishing
          # workflow as a runtime-artifact-poisoning risk -- a cache written
          # by an earlier, less-trusted run could be restored into a later
          # trusted publish run. ci.yml's zizmor step hard-fails the build on
          # any high-severity finding; see
          # https://docs.zizmor.sh/audits/#cache-poisoning.

      - name: Build release distributions
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          # Exact pin, same policy as the pip pin above (current stable 1.6.0;
          # ci.yml's "Build the wheel" step mirrors this -- keep them in step).
          python -m pip install "build==1.6.0"
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release-build
    permissions:
      # Mandatory for trusted publishing (OIDC).
      id-token: write

    environment:
      name: pypi
      # url: https://pypi.org/p/cyclaw

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
