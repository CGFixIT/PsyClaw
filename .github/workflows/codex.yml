name: Codex Agent (PR Comments)

# Deny-by-default at the workflow level. Every job below already declares the
# narrow set it needs, so this changes no current behaviour -- it changes what
# happens NEXT: a job added later without its own permissions block inherits
# this empty set and fails closed, instead of silently inheriting whatever the
# repository default happens to be. The other 16 workflows already carry a
# top-level block; this brings the last five in line.
permissions: {}

on:
  issue_comment:
    types: [created]

# Manual, advisory PR assistance only. Automatic reviews live in pr-review.yml.
# Owner-gated write path for "@codex apply fixes" / "@openai-code-agent apply fixes"
# (reply to a bot comment) lives in codex-apply-fixes.yml — keep this workflow read-only.
concurrency:
  group: codex-pr-comment-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@codex') &&
      !contains(github.event.comment.body, '@codex apply fixes') &&
      !contains(github.event.comment.body, '@openai-code-agent apply fixes') &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.issue.state == 'open'

    permissions:
      contents: read
      pull-requests: read

    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Resolve PR commits
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput("base-sha", pr.base.sha);
            core.setOutput("head-sha", pr.head.sha);

      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted

      # No actions/checkout of the PR head in this privileged issue_comment job:
      # it would land an untrusted worktree on the same runner that holds
      # secrets.CODEX (CodeQL actions/untrusted-checkout, alerts 1096/1093).
      # Review data comes from the API below as text files inside trusted/.

      - name: Record owner request and PR diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        with:
          script: |
            const fs = require("fs");
            // Hard caps: the posted comment is already capped at 60k chars;
            // a huge PR must not stall the secret-bearing runner.
            const DIFF_MAX_BYTES = 512 * 1024;
            const FILES_MAX = 300;
            const request = context.payload.comment.body
              .replace(/@codex\b/gi, "")
              .trim() || "Review this pull request.";
            fs.writeFileSync(
              "trusted/.codex-pr-request.json",
              JSON.stringify({
                pull_request: context.payload.issue.number,
                base_sha: process.env.PR_BASE_SHA,
                head_sha: process.env.PR_HEAD_SHA,
                request,
              }, null, 2) + "\n",
              "utf8",
            );
            // File list: path + status + sha only, never blob contents.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
              per_page: 100,
            });
            const truncatedFiles = files.length > FILES_MAX;
            fs.writeFileSync(
              "trusted/.codex-pr-files.json",
              JSON.stringify({
                truncated: truncatedFiles,
                files: files.slice(0, FILES_MAX).map((f) => ({
                  path: f.filename,
                  status: f.status,
                  sha: f.sha,
                })),
              }, null, 2) + "\n",
              "utf8",
            );
            // Unified diff of base...head as review data. Pin by SHAs from
            // pulls.get (never head.ref) so there is no TOCTOU window.
            let diff = "";
            let truncatedDiff = false;
            try {
              const resp = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${process.env.PR_BASE_SHA}...${process.env.PR_HEAD_SHA}`,
                mediaType: { format: "diff" },
              });
              diff = String(resp.data);
            } catch (err) {
              truncatedDiff = true;
              core.warning(`compareCommitsWithBasehead failed: ${err}`);
            }
            // Truncate by bytes, then back up to the last newline so the cut
            // lands on a whole diff line and never mid-character.
            const diffBytes = Buffer.from(diff, "utf8");
            if (diffBytes.length > DIFF_MAX_BYTES) {
              const capped = diffBytes.subarray(0, DIFF_MAX_BYTES);
              const lastNl = capped.lastIndexOf(0x0a);
              diff = capped.subarray(0, lastNl > 0 ? lastNl : DIFF_MAX_BYTES).toString("utf8");
              truncatedDiff = true;
            }
            if (truncatedDiff) {
              diff += "\n[truncated: diff unavailable or exceeded 512 KiB; review listed files individually via the PR files view]\n";
            }
            fs.writeFileSync("trusted/.codex-pr.diff", diff, "utf8");

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e  # v1
        with:
          openai-api-key: ${{ secrets.CODEX }}
          codex-version: '0.144.6'
          prompt-file: trusted/.codex/prompts/pr-agent.md
          working-directory: trusted
          sandbox: read-only
          safety-strategy: drop-sudo

  post_feedback:
    name: Post Codex feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: codex
    if: needs.codex.outputs.final_message != ''

    permissions:
      issues: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const header = [
              "Codex",
              "",
              "> Advisory, auto-generated over untrusted PR content — verify before acting on it.",
              "",
            ].join("\n");
            const body = header + process.env.CODEX_FINAL_MESSAGE;
            if (body.length > 60000) {
              core.setFailed(`Codex comment too long (${body.length} chars, max 60000).`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
