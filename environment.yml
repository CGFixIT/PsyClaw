# CyClaw environment.yml
# Generated for conda CI + reproducible local dev
# Matches pyproject.toml + production invariants (Python 3.12, offline-first, hardened deps)
# Use: conda env create -f environment.yml && conda activate cyclaw

name: cyclaw

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  # Core runtime — pinned to match pyproject.toml / constraints.txt exactly
  # (each version verified present on conda-forge, 2026-07). Keep these pins in
  # sync with pyproject.toml [project.dependencies] and constraints.txt; a bare
  # unpinned resolve here can silently drift from the pip path (e.g. numpy
  # floating to 2.x, which breaks chromadb/onnxruntime per CLAUDE.md).
  #
  # fastapi is the one deliberate exception: conda-forge's chromadb=1.5.9
  # build hard-pins fastapi==0.115.9 (confirmed via a live `mamba env create`
  # solve failure -- "fastapi=0.138.0 is not installable because it conflicts
  # with any installable versions previously reported"). This is a conda-forge
  # packaging constraint, not a CyClaw choice; the pip path stays on
  # fastapi==0.138.0 (pyproject.toml/constraints.txt) since PyPI's chromadb
  # 1.5.9 carries no such pin. Re-check this pin if chromadb is ever bumped here.
  - fastapi=0.115.9
  - uvicorn=0.49.0
  - pydantic=2.13.4
  - pyyaml=6.0.3
  - httpx=0.28.1
  - langchain-core=1.4.8
  - chromadb=1.5.9  # Note: Use embedded/PersistentClient only. See SECURITY.md
  #
  # Second deliberate exception, same shape as fastapi above: a conda-forge
  # packaging constraint, not a CyClaw choice, and conda-only (the pip path
  # resolves this correctly on its own and is untouched).
  #
  # conda-forge's chromadb=1.5.9 declares only
  # `opentelemetry-exporter-otlp-proto-grpc >=1.2.0` -- a 2022-era floor -- and
  # declares no protobuf constraint at all. The solver is therefore free to pair
  # a very old exporter with a current protobuf, and the exporter's shipped
  # `_pb2` files were generated by a protoc too old for a protobuf 4+ runtime:
  #
  #   chromadb/telemetry/opentelemetry/__init__.py
  #     -> opentelemetry/exporter/otlp/proto/grpc/exporter.py
  #        -> opentelemetry/proto/common/v1/common_pb2.py
  #           TypeError: Descriptors cannot be created directly.
  #           ...must be regenerated with protoc >= 3.19.0
  #
  # which fails `import chromadb` outright and reds the whole conda lane. Until
  # 2026-07-29 this was masked by a stale actions/cache entry in
  # python-package-conda.yml holding a known-good environment; a cache eviction
  # or any fresh clone hits it.
  #
  # Raising the exporter floor is the fix rather than pinning protobuf down: the
  # error text suggests "downgrade protobuf to 3.20.x", but chromadb=1.5.9 also
  # pulls grpcio>=1.58.0 and onnxruntime>=1.14.1, whose conda-forge builds link a
  # modern libprotobuf -- so pinning protobuf backwards fights the rest of the
  # solve, while a modern exporter ships regenerated protos that work with it.
  # conda-forge currently carries 1.42.1 and 1.43.0 (checked 2026-07-29).
  - opentelemetry-exporter-otlp-proto-grpc>=1.42
  - sentence-transformers=5.6.0
  # huggingface_hub is imported directly by retrieval/embeddings.py (not just an
  # implicit sentence-transformers transitive) and is now pinned explicitly on
  # the pip path too (pyproject.toml/constraints.txt). Safe to mirror here
  # unconditionally, unlike the fastapi/starlette pair below: sentence-transformers
  # is pinned identically (5.6.0) on both the conda and pip paths, so its
  # huggingface_hub floor doesn't diverge the way chromadb's conda build forces
  # fastapi to. Confirmed present on conda-forge at this exact version, 2026-08-02.
  - huggingface_hub=1.26.0
  # starlette is gate.py/harness/server.py's other direct-import pin (see the
  # same two files above) and is pinned starlette==1.3.1 on the pip path -- but
  # NOT mirrored here. Third deliberate exception, same shape as the fastapi one
  # above: starlette is fastapi's own core dependency, and this file's fastapi is
  # already pinned to the older 0.115.9 that conda-forge's chromadb=1.5.9 build
  # forces, not the pip path's 0.138.0. Forcing starlette=1.3.1 alongside
  # fastapi=0.115.9 would very likely demand a version pairing fastapi 0.115.9
  # never declares support for and break the conda solve -- unverified here (no
  # mamba/conda available to test-solve). Left as fastapi's own implicit
  # transitive until someone can confirm the compatible pin with a real solve.
  - numpy=1.26.4
  - nltk=3.10.0
  # Test & Dev tooling — pinned to match pyproject.toml's test/dev extras
  - pytest=9.1.1
  - pytest-asyncio=1.4.0
  - ruff=0.16.1
  - mypy=2.3.0
  - bandit=1.9.4
  - pytest-cov=7.1.0
  - pip:
      - langgraph==1.2.6
      - rank-bm25==0.2.2
      - websockets==15.0.1

# Optional: Create with mamba for speed
# mamba env create -f environment.yml

# After creation:
# conda activate cyclaw
# pip install -e ".[full]" --no-deps  # if wanting postgres/pgvector extras
