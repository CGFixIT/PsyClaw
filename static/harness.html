<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="__CYCLAW_CSRF_TOKEN__">
<title>CyClaw Harness</title>
<!-- No external fonts or CDNs: offline-first, loopback-only. System stacks. -->
<!-- The nonce placeholders below are swapped for a fresh per-response value by
     harness/server.py's console(); served from gate.py's /static mount instead
     they stay literal, and that CSP has no nonce source, so nothing runs. -->
<style nonce="__CYCLAW_CSP_NONCE__">
  :root {
    --bg-primary: #0d0f11;
    --bg-secondary: #13161a;
    --bg-tertiary: #1a1e24;
    --bg-input: #0a0c0e;
    --border: #2a2f38;
    --border-focus: #d4920b;
    --text-primary: #c8cdd5;
    --text-secondary: #6b7280;
    --text-muted: #454d59;
    --accent-amber: #d4920b;
    --accent-green: #2dd4a0;
    --accent-red: #ef5350;
    --accent-blue: #4a9eff;
    --accent-purple: #b48cff;
    --mono: 'Cascadia Code', 'Fira Code', ui-monospace, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  button, input { font: inherit; }
  body {
    background: var(--bg-primary); color: var(--text-primary);
    font-family: var(--sans); font-size: 13px; line-height: 1.5;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: var(--bg-secondary); border-bottom: 1px solid var(--border);
    padding: 8px 16px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .logo {
    font-family: var(--mono); font-weight: 700; font-size: 14px;
    color: var(--accent-amber); letter-spacing: 1.5px; text-transform: uppercase;
  }
  .logo span { color: var(--text-muted); font-weight: 400; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .pill {
    font-family: var(--mono); font-size: 10.5px; padding: 3px 10px;
    border: 1px solid var(--border); border-radius: 999px; color: var(--text-secondary);
    background: var(--bg-tertiary); white-space: nowrap;
  }
  .pill b { color: var(--accent-green); font-weight: 600; }
  .pill.model b { color: var(--accent-amber); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); }

  /* ── LAYOUT ── */
  .main { display: flex; flex: 1; min-height: 0; }

  /* sidebar */
  .sidebar {
    width: 264px; flex-shrink: 0; background: var(--bg-secondary);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .side-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .side-tab {
    flex: 1; padding: 8px 0; text-align: center; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-muted); background: none; border: none; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .side-tab.active { color: var(--accent-amber); border-bottom-color: var(--accent-amber); }
  .side-body { flex: 1; overflow-y: auto; padding: 10px; }
  .side-pane { display: none; }
  .side-pane.active { display: block; }

  .cmd-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 6px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-primary);
  }
  .cmd-item:hover { background: var(--bg-tertiary); }
  .cmd-item .c { color: var(--accent-blue); }
  .cmd-item .d { display: block; color: var(--text-muted); font-size: 10px; font-family: var(--sans); }

  .sess-item {
    padding: 7px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 3px;
    border: 1px solid transparent;
  }
  .sess-item:hover { background: var(--bg-tertiary); }
  .sess-item.current { border-color: var(--accent-amber); background: rgba(212,146,11,.07); }
  .sess-item .t { font-size: 12px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-item .m { font-family: var(--mono); font-size: 9.5px; color: var(--text-muted); }

  .reg-entry { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .reg-entry .n { font-family: var(--mono); font-size: 11px; color: var(--accent-green); }
  .reg-entry .n.catalog { color: var(--accent-purple); }
  .reg-entry .d { font-size: 10.5px; color: var(--text-secondary); }
  .reg-entry .a { font-size: 9.5px; color: var(--text-muted); font-family: var(--mono); }
  .reg-head {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); margin: 10px 4px 4px;
  }

  /* console */
  .console { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .stream { flex: 1; overflow-y: auto; padding: 16px 20px; font-family: var(--mono); font-size: 12.5px; }
  .msg { margin-bottom: 14px; max-width: 860px; }
  .msg .who { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .msg.user .who { color: var(--accent-blue); }
  .msg.agent .who { color: var(--accent-amber); }
  .msg.sys .who { color: var(--accent-purple); }
  .msg .body { white-space: pre-wrap; word-break: break-word; color: var(--text-primary); }
  .msg.sys .body { color: var(--text-secondary); font-size: 12px; }
  .msg .meta { font-size: 9.5px; color: var(--text-muted); margin-top: 3px; }
  .msg table { border-collapse: collapse; margin-top: 4px; font-size: 11.5px; }
  .msg td, .msg th { border: 1px solid var(--border); padding: 3px 9px; text-align: left; }
  .msg th { color: var(--accent-amber); }

  .inputbar {
    border-top: 1px solid var(--border); background: var(--bg-secondary);
    padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-shrink: 0;
  }
  .prompt-sym { font-family: var(--mono); color: var(--accent-amber); font-weight: 700; }
  #input {
    flex: 1; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-primary); padding: 9px 12px;
    font-family: var(--mono); font-size: 12.5px; outline: none;
  }
  #input:focus { border-color: var(--border-focus); }
  #send {
    background: var(--accent-amber); color: #000; border: none; border-radius: 8px;
    padding: 9px 18px; font-family: var(--mono); font-size: 12px; font-weight: 700;
    cursor: pointer;
  }
  #send:disabled { opacity: .4; cursor: default; }

  /* status bar */
  .statusbar {
    border-top: 1px solid var(--border); background: var(--bg-secondary);
    padding: 5px 16px; display: flex; gap: 16px; align-items: center;
    font-family: var(--mono); font-size: 10px; color: var(--text-secondary); flex-shrink: 0;
  }
  .statusbar .k { color: var(--text-muted); }
  .statusbar .v { color: var(--text-primary); }
  .statusbar .spacer { flex: 1; }
  .panel-status {
    font-family: var(--mono); font-size: 12px; color: var(--accent-red);
    padding: 8px 12px; min-height: 16px;
  }
  #sGoal {
    max-width: 140px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; display: inline-block; vertical-align: bottom;
  }
  .toggle { cursor: pointer; background: none; border: none; font: inherit; color: inherit; padding: 0; }
  .toggle .v.on { color: var(--accent-green); }
  .toggle .v.off { color: var(--accent-red); }
  .apikey {
    font: inherit; color: var(--text-primary); background: none; width: 130px;
    border: none; border-bottom: 1px solid var(--text-muted); padding: 0 2px; outline: none;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">CyClaw <span>/ harness</span></div>
    <div class="header-right">
      <span id="harnessAuth">
        <span id="hAuthSetup" hidden>
          <input class="apikey" id="hAuthSetupPass" type="password" placeholder="set admin password" autocomplete="new-password">

        <button class="toggle" id="sSoul" title="toggle soul.md in the system prompt">

        </button>
        <button class="toggle" id="sMemory" title="toggle operator /memory notes in the system prompt">
          <span class="k">mem </span><span class="v" id="sMemoryV">…</span>
        </button>
        <span title="session /goal"><span class="k">goal </span><span class="v" id="sGoal">none</span></span>

        <span class="spacer"></span>
        <span><span class="k">key </span><input class="apikey" id="apiKey" type="password" autocomplete="off"
          spellcheck="false" placeholder="CYCLAW_API_KEY" title="operator API key; held in memory only"></span>
        <span class="k" id="sHome" title="harness home"></span>

    </div>
  </div>
  <input id="agentPlanFile" type="file" accept=".md,.txt,text/markdown,text/plain" hidden>

<script src="/static/auth_admin.js"></script>
<script nonce="__CYCLAW_CSP_NONCE__">
'use strict';
/* Model output and registry data are DATA, never HTML: everything rendered
   through textContent or the table() builder (createElement + textContent). */
const $ = id => document.getElementById(id);
const stream = $('stream'), input = $('input'), sendBtn = $('send'), apiKeyInput = $('apiKey');
const agentPlanInput = $('agentPlanFile');
const MAX_AGENT_PLAN_CHARS = 6100;
const MAX_AGENT_PLAN_BYTES = 25000;
/* Mirrors harness.schemas._MAX_READ_FILES and the clone-jail path rules in
   utils.repo_paths.canonical_repo_relative_path (keep in sync via console contract tests). */
const MAX_AGENT_READ_FILES = 8;
const MAX_AGENT_READ_FILE_LEN = 1024;
/* Session goal + human-gated loop. Caps match harness.schemas._MAX_GOAL_LEN
   and the locked /loop budget (default 3, hard max 5). */
function isSafeRepoRelativePath(raw) {
  if (typeof raw !== 'string' || !raw || raw.length > MAX_AGENT_READ_FILE_LEN || raw.indexOf('\0') !== -1) return false;
  const normalized = raw.replace(/\\/g, '/');
  if (normalized.charAt(0) === '/' || normalized.charAt(0) === '-') return false;
  if (/^[A-Za-z]:/.test(raw) || normalized.indexOf('://') !== -1) return false;
  const parts = normalized.split('/').filter(part => part !== '' && part !== '.');
  if (!parts.length) return false;
  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    if (part === '..' || part.indexOf(':') !== -1) return false;
    // Mirror utils/repo_paths.py: Windows silently strips trailing spaces/dots
    // from a path component, so "README.md." and "README.md" open the same file.
    // Reject outright rather than letting a confirmed run proceed without the
    // context the operator declared.
    if (part !== part.replace(/[ .]+$/, '')) return false;
  }
  return true;
}
function canonicalRepoRelativePath(raw) {
  if (!isSafeRepoRelativePath(raw)) return null;
  return raw.replace(/\\/g, '/').split('/').filter(part => part !== '' && part !== '.').join('/');
}
/* Substituted server-side into the meta tag at serve time (harness/server.py's
   console() route) -- the literal placeholder below never reaches a browser. */
const csrfMeta = document.querySelector('meta[name="csrf-token"]');
const CSRF_TOKEN = csrfMeta ? csrfMeta.content : '';

let currentSession = null;   // session_id string or null
let soulEnabled = true;
let memoryEnabled = false;
/* A staged (not yet sent) agent run. The server's own gate needs an explicit
   reason plus confirm, so the console stages first and shows the operator
   exactly what they are about to authorize; /agent confirm is what sends it.
   Cleared on send, on /agent cancel, and on /clear. */
let pendingAgentRun = null;
let sessionGoal = '';
let loopAuto = false;
const MAX_GOAL_CHARS = 2000;
const MAX_LOOP_TURNS = 5;
const DEFAULT_LOOP_TURNS = 3;
/* Local 27b (qwen3.8:27b-mlx on Apple Silicon) needs a breath between auto
   turns so /loop stop can land and Metal is not hammered. */
const LOOP_COOLDOWN_MS = 2000;
/* Aggregate reported completion usage across turns, checked after each reply.
   The server separately controls each turn's generation budget. */
const MAX_LOOP_TOTAL_COMPLETION_TOKENS = 12000;
const MAX_LOOP_FAILURES = 2;
const LOOP_RETRY_CAP_SEC = 30;
/* Client deadlines for routes that block on a server-side subprocess
   (utils/ops_runner.py): POST /api/agent/run holds the request up to
   min(iters*planner_sec + iters*checks*120 + 300, 3600)s; the run
   status/decision/push/discard/publish and github-status routes shell a CLI
   bounded at 120s (_TIMEOUT_SEC). Each client deadline sits above its server
   budget so the server's typed error envelope arrives instead of a browser
   abort at 15s while the subprocess keeps burning. */
const AGENT_RUN_TIMEOUT_MS = 3630000;  /* 3600s ops_runner cap + 30s margin */
const AGENT_CLI_TIMEOUT_MS = 130000;   /* 120s ops_runner._TIMEOUT_SEC + 10s margin */
/* Active human-gated /loop. Never starts a real-repo run. Cleared on
   /loop stop, /clear, session switch, budget exhaust, or GOAL_DONE. */
let loopState = null;
/* AbortController for the in-flight POST /api/chat. /loop stop aborts
   the browser wait AND tells the server to drop the Ollama socket. */
let inflightChat = null;

function paintGoalLoop() {
  const g = $('sGoal');
  if (g) {
    g.textContent = sessionGoal ? sessionGoal : 'none';
    g.title = sessionGoal || 'no session goal';
  }
  const l = $('sLoop');
  if (!l) return;
  if (!loopState) {
    l.textContent = loopAuto ? 'auto' : 'off';
    return;
  }
  const done = loopState.total - loopState.remaining;
  l.textContent = (loopState.auto ? 'auto ' : '') + done + '/' + loopState.total;
}

/* ── stream rendering ── */
function addMsg(kind, who, body, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + kind;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const b = document.createElement('div'); b.className = 'body';
  if (body instanceof Node) { b.appendChild(body); } else { b.textContent = body; }
  div.appendChild(w); div.appendChild(b);
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; div.appendChild(m); }
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
  return div;
}
const sys   = (t, m) => addMsg('sys',   'harness', t, m);
const user  = t      => addMsg('user',  'you', t);
const agent = (t, m) => addMsg('agent', 'cyclaw', t, m);

function table(rows, headers) {
  const t = document.createElement('table');
  if (headers) {
    const tr = document.createElement('tr');
    headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; tr.appendChild(th); });
    t.appendChild(tr);
  }
  rows.forEach(r => {
    const tr = document.createElement('tr');
    r.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
    t.appendChild(tr);
  });
  return t;
}

function renderToolsDiagram(tools, wired, total) {
  if (!tools || !tools.length) return 'HARNESS TOOLS — none';
  if (tools.length === 1) {
    const row = tools[0];
    const invoked = row.invoked ? 'yes' : 'no (catalog only)';
    const wiredMark = row.wired ? 'yes' : 'no';
    const inner = [
      ' name        ' + row.name,
      ' slash       ' + row.slash,
      ' route       ' + row.method + ' ' + row.path,
      ' kind        ' + row.kind,
      ' invoked     ' + invoked,
      ' wired       ' + wiredMark,
      '',
      ' ' + row.description,
    ];
    let width = 0;
    inner.forEach(line => { if (line.length > width) width = line.length; });
    const edge = '─'.repeat(width + 1);
    const title = ' /' + row.name + ' ';
    const head = title.length < edge.length
      ? '┌' + title + edge.slice(title.length) + '┐'
      : '┌' + edge + '┐';
    const body = inner.map(line => '│' + line.padEnd(width, ' ') + ' │');
    return [head].concat(body).concat(['└' + edge + '┘']).join('\n');
  }
  const lines = ['HARNESS TOOLS — ' + wired + ' wired / ' + total + ' listed', ''];
  const harness = tools.filter(t => t.kind === 'harness');
  const mcp = tools.filter(t => t.kind === 'mcp');
  const treeLines = (row, last, indent) => {
    const branch = last ? '└─' : '├─';
    const mark = row.wired ? '●' : '○';
    const child = last ? '  ' : '│ ';
    const slash = (row.slash || '').padEnd(16, ' ');
    return [
      indent + branch + '[' + row.name + '] ' + mark + '  ' + row.method + ' ' + row.path,
      indent + child + ' ' + slash + ' ' + row.description,
    ];
  };
  if (harness.length) {
    lines.push('console');
    harness.forEach((row, index) => {
      const last = index === harness.length - 1 && !mcp.length;
      treeLines(row, last, '').forEach(line => lines.push(line));
    });
  }
  if (mcp.length) {
    lines.push('└─ mcp (AST catalog; this console does not invoke these)');
    mcp.forEach((row, index) => {
      treeLines(row, index === mcp.length - 1, '   ').forEach(line => lines.push(line));
    });
  }
  return lines.join('\n');
}

function renderSkillsDiagram(skills, wired, total) {
  if (!skills || !skills.length) return 'HARNESS SKILLS — none';
  if (skills.length === 1) {
    const row = skills[0];
    const invoked = row.invoked ? 'yes' : 'no (catalog only)';
    const wiredMark = row.wired ? 'yes' : 'no';
    const inner = [
      ' name        ' + row.name,
      ' role        ' + row.role,
      ' path        ' + row.path,
      ' source      ' + row.source,
      ' invoked     ' + invoked,
      ' wired       ' + wiredMark,
      '',
      ' ' + row.description,
    ];
    let width = 0;
    inner.forEach(line => { if (line.length > width) width = line.length; });
    const edge = '─'.repeat(width + 1);
    const title = ' /' + row.name + ' ';
    const head = title.length < edge.length
      ? '┌' + title + edge.slice(title.length) + '┐'
      : '┌' + edge + '┐';
    const body = inner.map(line => '│' + line.padEnd(width, ' ') + ' │');
    return [head].concat(body).concat(['└' + edge + '┘']).join('\n');
  }
  const lines = ['HARNESS SKILLS — ' + wired + ' wired / ' + total + ' listed', ''];
  const groups = [
    ['prompt', 'prompt (injected into every chat turn)'],
    ['check', 'agent-check (named /agent checks profiles)'],
    ['repo', 'repo catalog (present; this console does not invoke these)'],
    ['governed', 'governed registry (read-only; mutations stay behind agentic CLI)'],
  ];
  groups.forEach(pair => {
    const rows = skills.filter(s => s.role === pair[0]);
    if (!rows.length) return;
    lines.push(pair[1]);
    rows.forEach((row, index) => {
      const last = index === rows.length - 1;
      const branch = last ? '└─' : '├─';
      const mark = row.wired ? '●' : '○';
      const child = last ? '  ' : '│ ';
      lines.push(branch + '[' + row.name + '] ' + mark + '  ' + row.path);
      lines.push(child + ' ' + (row.description || ''));
    });
  });
  return lines.join('\n');
}

function renderWebStatus(data) {
  const rows = [
    ['enabled', data.enabled ? 'yes' : 'no (fail-closed)'],
    ['allowlist', (data.allowlist && data.allowlist.length) ? data.allowlist.join('\n') : '(empty — /web allow <url>)'],
    ['injected', data.injected ? 'yes' : 'no'],
    ['last extract', data.has_last ? 'yes — /web inject to put it in chat' : 'none'],
  ];
  return table(rows, ['field', 'value']);
}

/* ── API ── */
/* The Authorization header is attached HERE, in the helper body, never at a call
   site. tests/test_harness_console_contract.py hand-parses this file: it locates
   every invocation of this helper, reads the path from argument 0 and the method
   from argument 1, and cross-checks both against the live app's routes. Adding a
   header argument at the 17 call sites -- or switching to an options object --
   would break that parser (an options object in argument 1 fails its method
   regex, so every call would silently record as GET). Changing only this body is
   invisible to it. The parser also has no comment handling, so this comment must
   avoid writing the helper's name followed by an open paren. */
async function api(path, method, body, timeoutMs) {
  const opts = { method: method || 'GET', headers: {} };
  /* Attach the in-flight chat AbortController here (body only) so the
     contract parser that hand-reads call sites stays valid. */
  if (inflightChat && path === '/api/chat' && (method || 'GET') === 'POST') {
    opts.signal = inflightChat.signal;
  }
  const key = apiKeyInput ? apiKeyInput.value.trim() : '';
  /* Sent on every request, not just the guarded ones: the open read routes
     ignore it, and branching per-path here would drift from the server's guard
     list. Held in the input element only -- never localStorage, never a cookie
     (a cookie would be sent automatically by a cross-site page, which is exactly
     the CSRF shape the server's origin check exists to stop). */
  if (key) opts.headers['Authorization'] = 'Bearer ' + key;
  /* Minted per-process server-side and substituted into the meta tag above at
     serve time -- never typed in, never stored beyond this page load. A caller
     that never fetched this page (a local process replaying just the API key,
     with no browser Origin/Sec-Fetch-Site headers to trip the origin check)
     does not have it. */
  if (CSRF_TOKEN) opts.headers['X-CyClaw-CSRF'] = CSRF_TOKEN;
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  /* Chat keeps inflightChat.signal so /loop stop still aborts. Every other
     route goes through fetchWithTimeout so a stalled gateway cannot hang the
     status/keys/web panels the way #1126 already bounded the auth probes.
     Long-running routes (agent run/CLI-backed reads) pass their own timeoutMs
     sized above the server-side subprocess budget, so the server's typed
     AGENTIC_TIMEOUT/OPS envelope wins the race instead of a generic abort. */
  let resp;
  try {
    resp = opts.signal
      ? await fetch(path, opts)
      : await fetchWithTimeout(path, opts, timeoutMs || 15000);
  } catch (e) {
    const message = e && typeof e.message === 'string' ? e.message : '';
    const isFetchFailure = (e && e.name === 'AbortError') || e instanceof TypeError ||
      /failed to fetch|load failed|networkerror/i.test(message);
    if (!isFetchFailure) throw e;
    const target = new URL(path, window.location.href).href;
    const err = new Error(
      'NETWORK: cannot reach the harness API at ' + target +
      '. Open http://127.0.0.1:8790/ unless CYCLAW_HARNESS_PORT overrides the default.'
    );
    /* Preserve AbortError so an intentional /loop stop remains silent in
       sendChat(), while every visible abort gets the actionable message. */
    err.name = e && e.name === 'AbortError' ? 'AbortError' : 'NetworkError';
    err.code = 'NETWORK';
    err.details = { path: path, target: target };
    throw err;
  }
  let data = null;
  try {
    data = await resp.json();
  } catch (e) {
    if (resp.ok) throw new Error('HTTP ' + resp.status + ' non-JSON from ' + path);
    /* Preserve the HTTP status below for non-JSON error bodies. */
  }
  if (!resp.ok) {
    const d = data && data.detail !== undefined ? data.detail : data;
    const validation = Array.isArray(d) && d.length ? d[0] : null;
    const typed = d && !Array.isArray(d) && typeof d === 'object' ? d : null;
    const code = typed && typed.code ? typed.code : '';
    let msg = typed && typed.message
      ? (code ? code + ': ' : 'HTTP ' + resp.status + ': ') + typed.message
      : validation && validation.msg
        ? 'HTTP ' + resp.status + ': ' + validation.msg
        : typeof d === 'string'
          ? 'HTTP ' + resp.status + ': ' + d
          : 'HTTP ' + resp.status;
    /* The console's key input sends a Bearer to the server, but the server
       compares it against CYCLAW_API_KEY in its own process environment. When
       that env var is unset, typing a key here cannot help until the server is
       restarted with the key sourced from the shell. Make that explicit so the
       operator does not think the input field is broken. */
    if (typed && typed.code === 'UNAUTHORIZED' && typed.details && typed.details.reason === 'key_not_configured') {
      msg += '\nThe harness server was started without CYCLAW_API_KEY in its environment. Set it in the shell that launches the harness and restart; typing it here only works when the server already has the same key configured.';
    }
    if (code === 'CROSS_ORIGIN_BLOCKED' || code === 'CROSS_SITE_BLOCKED') {
      msg += '\nBookmark and fetch the same host, scheme, and port. localhost and 127.0.0.1 are different browser origins. Open http://127.0.0.1:8790/ (use your configured harness port), not file://.';
    }
    const err = new Error(msg);
    err.code = code;
    err.details = typed && typed.details ? typed.details : {};
    const headerWait = parseInt(resp.headers.get('Retry-After') || '0', 10);
    const bodyWait = typed && typed.details && typed.details.retry_after_sec;
    err.retryAfter = headerWait || (typeof bodyWait === 'number' ? bodyWait : 0);
    throw err;
  }
  return data;
}

/* ── status / statusbar ── */
async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = window.setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    window.clearTimeout(timer);
  }
}

const STATUS_BASE_INTERVAL = 15000;
const STATUS_MAX_INTERVAL = 120000;
let statusBackoffMs = STATUS_BASE_INTERVAL;
let statusTimer = null;
let statusVisible = true;

async function refreshStatus() {
  if (statusTimer) { window.clearTimeout(statusTimer); statusTimer = null; }
  try {
    const s = await api('/api/status');
    $('hModel').textContent = s.model || '(unset)';
    $('hTokens').textContent = s.total_tokens.toLocaleString();
    $('sProvider').textContent = s.provider;
    $('sHome').textContent = s.home;
    $('sHome').title = 'harness home: ' + s.home + '  ·  repo: ' + s.repo_root;
    soulEnabled = s.soul_enabled;
    if (typeof s.memory_enabled === 'boolean') memoryEnabled = s.memory_enabled;
    paintSoul();
    paintMemory();
    $('hDot').style.background = 'var(--accent-green)';
    statusBackoffMs = STATUS_BASE_INTERVAL;
  } catch (e) {
    $('hDot').style.background = 'var(--accent-red)';
    statusBackoffMs = Math.min(statusBackoffMs * 2, STATUS_MAX_INTERVAL);
  }
  scheduleStatusRefresh();
}

function scheduleStatusRefresh() {
  if (statusTimer) { window.clearTimeout(statusTimer); statusTimer = null; }
  if (statusVisible) {
    statusTimer = window.setTimeout(refreshStatus, statusBackoffMs);
  }
}

document.addEventListener('visibilitychange', () => {
  statusVisible = !document.hidden;
  if (statusVisible) {
    scheduleStatusRefresh();
  } else if (statusTimer) {
    window.clearTimeout(statusTimer);
    statusTimer = null;
  }
});
function paintSoul() {
  const v = $('sSoulV');
  v.textContent = soulEnabled ? 'on' : 'off';
  v.className = 'v ' + (soulEnabled ? 'on' : 'off');
}
function paintMemory() {
  const v = $('sMemoryV');
  if (!v) return;
  v.textContent = memoryEnabled ? 'on' : 'off';
  v.className = 'v ' + (memoryEnabled ? 'on' : 'off');
}

async function refreshRegistry() {

/* Renders the /api key table. The server never sends a secret: each row
   carries only presence, a masked tail, and where the value is coming from
   (`env` = this process already has it, `file` = written but needs a restart). */
function renderKeys(keys) {
  sys(table(keys.map(k => [
    k.name,
    k.configured ? k.masked : '(unset)',
    k.source,
    k.pending_restart ? 'restart pending' : '',
  ]), ['key', 'value', 'source', 'state']));
}

function buildCommands() {
  const pane = $('pane-commands');
  COMMANDS.forEach(([c, d]) => {
    const b = document.createElement('button');
    b.className = 'cmd-item';
    const inner = document.createElement('span'); inner.className = 'c'; inner.textContent = c;
    const desc = document.createElement('span'); desc.className = 'd'; desc.textContent = d;
    b.appendChild(inner); b.appendChild(desc);

/* ── agentic coding runs ── */
/* Every agent route answers with the ops-shim envelope
   {ok, label, exit_code, stdout, stderr, parsed}. A FAILED run is still an
   HTTP 200 -- the shim succeeded, the subprocess it ran did not -- so the
   fetch helper above never throws for one, and the shared catch in runSlash
   would silently render nothing. Three cases have to be told apart here
   rather than there:
     ok=false            -> the CLI refused or failed; its message is in stderr
     ok=true,  parsed=null -> agentic.enabled is false, which is the SHIPPED
                              default; the human banner is in stdout, and
                              reaching for parsed.run_id would be a TypeError
     ok=true,  parsed     -> a real run record */
function agentRecord(r) {
  if (!r.ok) {
    sys('agent run failed (' + r.label + ', exit ' + r.exit_code + ')\n' + (r.stderr || r.stdout || ''));
    return null;
  }
  if (!r.parsed || typeof r.parsed !== 'object') {
    sys('the agentic layer is disabled in config.yaml — nothing ran.\n' + (r.stdout || ''));
    return null;
  }
  return r.parsed;
}
function showPendingAgentRun() {
  if (!pendingAgentRun) return;
  sys(table([
    ['branch', pendingAgentRun.branch],
    ['instruction', pendingAgentRun.instruction],
    ['commit message', pendingAgentRun.commit_message],
    ['plan', pendingAgentRun.plan ? 'loaded (' + pendingAgentRun.plan.length + ' chars)' : 'none'],
    ['read files', pendingAgentRun.read_files.join(', ') || 'none'],
    ['checks', pendingAgentRun.checks.join(', ')],
  ], ['field', 'value']));
}

agentPlanInput.addEventListener('change', () => {
  const file = agentPlanInput.files && agentPlanInput.files[0];
  const stagedRun = pendingAgentRun;
  agentPlanInput.value = '';
  if (!file || !stagedRun) return;
  if (file.size > MAX_AGENT_PLAN_BYTES) {
    sys('plan file is too large; keep reviewed plans below ' + MAX_AGENT_PLAN_CHARS + ' characters');
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => sys('could not read the selected plan file');
  reader.onload = () => {
    if (pendingAgentRun !== stagedRun) {
      sys('staged run changed before the plan loaded; select it again for the current run');
      return;
    }
    const plan = typeof reader.result === 'string' ? reader.result : '';
    if (!plan.trim()) { sys('plan file is empty'); return; }
    if (plan.length > MAX_AGENT_PLAN_CHARS) {
      sys('plan is too long; keep reviewed plans below ' + MAX_AGENT_PLAN_CHARS + ' characters');
      return;
    }
    pendingAgentRun.plan = plan;
    sys('reviewed plan loaded; reselect it after any local edit.\n' + plan);
    showPendingAgentRun();
  };
  reader.readAsText(file);
});

function showAgentRecord(rec) {
  sys(table([
    ['run id', rec.run_id],
    ['status', rec.status],
    ['repo', rec.repo],
    ['branch', rec.branch_name || '—'],
    ['commit message', rec.commit_message || '—'],
    ['files', (rec.changed_files || []).join(', ') || '—'],
    ['iterations', String(rec.iterations)],
    ['pushed', rec.pushed ? 'yes' : 'no'],
    ['pull request', rec.pr_url || '—'],
    ['error', rec.error || '—'],
  ], ['field', 'value']));
  if (rec.status === 'pending_decision' && rec.diff) {
    sys('candidate diff\n' + rec.diff);
    sys('diff shown above — /agent approve ' + rec.run_id + '   or   /agent reject ' + rec.run_id);
  } else if (rec.status === 'pending_decision') {
    sys('diff not loaded — inspect with /agent status ' + rec.run_id + ' before deciding');
  }
  // Each escalation past approve is its own decision, so the console offers
  // the next one rather than performing it. Both are disarmed on a shipped
  // checkout (allow_git_write_tools / EXECUTION_ENABLED) — the prompt is the
  // honest next step, not a promise it will succeed.
  else if (rec.status === 'approved' && !rec.pushed)
    sys('committed locally — push it to origin with:  /agent push ' + rec.run_id);
  else if (rec.status === 'approved' && rec.pushed && !rec.pr_url)
    sys('pushed — open a draft PR with:  /agent publish ' + rec.run_id + ' <why>');
  // An approved run keeps its clone on disk on purpose (push/publish need
  // it), and nothing reclaims it automatically -- so say so once the run has
  // nowhere left to go, rather than leaking a clone per run silently.
  else if (rec.status === 'exhausted' || rec.status === 'failed' || rec.pr_url)
    sys('done with this run? reclaim its clone with:  /agent discard ' + rec.run_id);
}

/* ── slash commands ── */
async function runSlash(line) {
  const parts = line.slice(1).split(/\s+/).filter(Boolean);
  if (!parts.length) {
    sys('unknown command: / — try /help');
    return;
  }
  const cmd = parts[0].toLowerCase();
  const rest = parts.slice(1);
  const arg = rest.join(' ').trim();
  try {
    switch (cmd) {
      case 'help':
        sys(table(COMMANDS.map(c => [c[0], c[1]]), ['command', 'action']));
        break;

      case 'session': {
        const sub = rest[0] || 'list';
        if (sub === 'new') {
          const s = await api('/api/sessions', 'POST', { title: rest.slice(1).join(' ') });
          currentSession = s.session_id;
          sessionGoal = '';
          loopState = null;
          paintGoalLoop();
          sys('session created: ' + s.session_id + ' — ' + s.title);
        } else if (sub === 'use') {
          const s = await api('/api/sessions/' + encodeURIComponent(rest[1] || ''));
          currentSession = s.session_id;
          sys('switched to session ' + s.session_id + ' — ' + s.title +
              ' (' + s.message_count + ' messages, ' + s.tokens.total + ' tokens)');
          sessionGoal = typeof s.goal === 'string' ? s.goal : '';
          loopState = null;
          paintGoalLoop();
          s.messages.slice(-10).forEach(m => {
            if (m.role === 'user') user(m.content); else if (m.role === 'assistant') agent(m.content);
          });
        } else if (sub === 'rename') {
          if (!currentSession) { sys('no active session'); break; }
          const s = await api('/api/sessions/' + encodeURIComponent(currentSession) + '/rename', 'POST', { title: rest.slice(1).join(' ') });
          sys('renamed to: ' + s.title);
        } else if (sub === 'info') {
          if (!currentSession) { sys('no active session'); break; }
          const s = await api('/api/sessions/' + encodeURIComponent(currentSession));
          sys(table([['id', s.session_id], ['title', s.title], ['model', s.model],
                     ['messages', String(s.message_count)], ['tokens', String(s.tokens.total)]]));
        } else {
          const data = await api('/api/sessions');
          sys(table(data.sessions.map(s =>
            [s.session_id, s.title, String(s.message_count), String(s.tokens.total)]),
            ['id', 'title', 'msgs', 'tokens']));
        }
        $('sSession').textContent = currentSession || 'none';
        await refreshSessions();
        break;
      }

      case 'soul': {
        if (arg === 'on' || arg === 'off') {
          const r = await api('/api/soul', 'POST', { enabled: arg === 'on' });
          soulEnabled = r.enabled; paintSoul();
          sys('soul ' + (r.enabled ? 'enabled' : 'disabled') +
              ' (system prompt only — soul.md itself is governed and untouched)');
        } else {
          const r = await api('/api/soul');
          sys('soul is ' + (r.enabled ? 'ON' : 'OFF'));
        }
        break;
      }

      case 'memory': {
        const sub = (rest[0] || '').toLowerCase();
        if (sub === 'on' || sub === 'off') {
          const r = await api('/api/memory', 'POST', { enabled: sub === 'on' });
          memoryEnabled = !!r.enabled; paintMemory();
          sys('memory ' + (r.enabled ? 'ON' : 'OFF') +
              ' — notes stay in ~/.CyClaw/memory; RAG memory/ is ' +
              ((r.rag && r.rag.enabled) ? 'on' : 'off') +
              ' (read-only; this command cannot flip it)');
        } else if (sub === 'add') {
          const text = rest.slice(1).join(' ').trim();
          if (!text) { sys('usage: /memory add <note>'); break; }
          const r = await api('/api/memory/add', 'POST', { text: text });
          memoryEnabled = !!r.enabled; paintMemory();
          sys(table([['id', r.added && r.added.id], ['count', String(r.count)],
                     ['enabled', r.enabled ? 'on' : 'off']]));
        } else if (sub === 'forget') {
          const nid = rest[1] || '';
          if (!nid) { sys('usage: /memory forget <id>'); break; }
          const r = await api('/api/memory/forget', 'POST', { id: nid });
          sys('forgot ' + (r.forgotten || nid) + ' (' + String(r.count) + ' left)');
        } else if (sub === 'clear') {
          const r = await api('/api/memory/clear', 'POST');
          sys('memory notes cleared (' + String(r.count) + ')');
        } else {
          const r = await api('/api/memory');
          memoryEnabled = !!r.enabled; paintMemory();
          const rag = r.rag || {};
          sys(table([
            ['harness /memory', r.enabled ? 'ON (injected)' : 'OFF (stored, not injected)'],
            ['notes', String(r.count) + ' / ' + String(r.max_notes)],
            ['RAG memory.enabled', rag.enabled ? 'on' : 'off'],
            ['RAG writable here', rag.writable_from_harness ? 'yes' : 'no'],
          ]));
          if (r.notes && r.notes.length) {
            sys(table(r.notes.map(n => [n.id, n.text]), ['id', 'note']));
          }
        }
        break;
      }

      case 'api': {
        if (rest[0] === 'set' && rest[1] && rest[2]) {
          const name = rest[1].toUpperCase();
          // Everything after the key name is the value: a DB URL can contain
          // spaces once percent-decoded, and re-joining is safer than assuming
          // the operator quoted it.
          const secret = rest.slice(2).join(' ');
          const r = await api('/api/keys', 'POST', { keys: { [name]: secret } });
          // POST /api/keys returns the destination as `path` (write_keys);
          // `env_file` is the GET-only spelling. Reading the wrong one here
          // printed "-> undefined" on every successful save.
          sys('saved: ' + r.written.join(', ') + '  ->  ' + r.path);
          if (r.restart_required)
            sys('restart gate.py to load it: nothing in CyClaw reads .env at runtime, ' +
                'your shell sources it (see docs/HARNESS_API_KEYS.md)');
          if (r.self_auth_written && r.self_auth_written.length)
            sys('note: ' + r.self_auth_written.join(', ') + ' is the key guarding this console. ' +
                'It was NOT applied live -- your current key keeps working until you restart.');
          await renderKeys(r.keys);
        } else if (rest[0] === 'set') {
          sys('usage: /api set <KEY> <value>');
        } else {
          const r = await api('/api/keys');
          sys('key file: ' + r.env_file);
          await renderKeys(r.keys);
        }
        break;
      }

      case 'model': {
        if (rest[0] === 'use' && rest[1]) {
          const r = await api('/api/model', 'POST', { model: rest.slice(1).join(' ') });
          sys('model selected: ' + r.model);
          await refreshStatus();
        } else {
          const s = await api('/api/status');
          sys(table([['model', s.model || '(unset)'], ['provider', s.provider], ['base_url', s.base_url]]));
        }
        break;
      }

      case 'connectors': case 'registry': {
        const reg = await api('/api/registry');
        if (cmd === 'registry')
          sys(table(reg.skills.map(s => [s.name, s.source]), ['skill', 'source']));
        if (cmd === 'registry')
          sys(table(reg.tools.map(t => [t.name, t.description]), ['tool', 'description']));
        if (cmd === 'connectors' || cmd === 'registry')
          sys(table(reg.connectors.map(c => [c.name, c.kind, c.auth]), ['connector', 'kind', 'auth']));
        break;
      }

      case 'skills': {
        if (arg === 'help') {
          sys(table([
            ['/skills', 'diagram of harness skills that are actually wired'],
            ['/skills all', 'include repo / governed catalog'],
            ['/skills <name>', 'one-skill box diagram'],
          ], ['command', 'action']));
          break;
        }
        const inventory = await api('/api/skills');
        const listed = inventory.skills || [];
        let rows = listed;
        if (arg && arg !== 'all') {
          const needle = arg.replace(/^\//, '');
          rows = listed.filter(s => s.name === needle || s.name === arg);
          if (!rows.length) {
            sys('unknown skill: ' + arg + ' — /skills to list wired names');
            break;
          }
        } else if (arg !== 'all') {
          rows = listed.filter(s => s.wired);
        }
        sys(renderSkillsDiagram(rows, inventory.wired, inventory.total),
            inventory.wired + ' wired / ' + inventory.total + ' listed');
        break;
      }

      case 'tools': {
        if (arg === 'help') {
          sys(table([
            ['/tools', 'diagram of harness tools that are actually wired'],
            ['/tools all', 'include unwired / catalog rows'],
            ['/tools <name>', 'one-tool box diagram'],
          ], ['command', 'action']));
          break;
        }
        const inventory = await api('/api/tools');
        const listed = inventory.tools || [];
        let rows = listed;
        if (arg && arg !== 'all') {
          const needle = arg.replace(/^\//, '');
          rows = listed.filter(t => t.name === needle || t.name === arg ||
            (t.slash && t.slash.replace(/^\//, '').split(' ')[0] === needle));
          if (!rows.length) {
            sys('unknown tool: ' + arg + ' — /tools to list wired names');
            break;
          }
        } else if (arg !== 'all') {
          rows = listed.filter(t => t.wired);
        }
        sys(renderToolsDiagram(rows, inventory.wired, inventory.total),
            inventory.wired + ' wired / ' + inventory.total + ' listed');
        break;
      }

      case 'web': {
        const sub = rest[0] || 'status';
        if (sub === 'help') {
          sys(table([
            ['/web', 'status: enabled + allowlist (no page text)'],
            ['/web on|off', 'enable or disable fetches (persisted)'],
            ['/web allow <url>', 'add a host or URL-prefix (no wildcards)'],
            ['/web deny <url>', 'remove one allowlist entry'],
            ['/web fetch <url>', 'GET one allowlisted URL (text only)'],
            ['/web search <query>', 'scan allowlisted pages; no search engine'],
            ['/web inject', 'put last extract in the next chat prompt'],
            ['/web forget', 'clear injected extract'],
          ], ['command', 'action']));
          break;
        }
        if (sub === 'on' || sub === 'off') {
          sys(renderWebStatus(await api('/api/web', 'POST', { enabled: sub === 'on' })));
          break;
        }
        if (sub === 'allow') {
          const url = rest.slice(1).join(' ').trim();
          if (!url) { sys('usage: /web allow <https://host/path>'); break; }
          sys(renderWebStatus(await api('/api/web/allow', 'POST', { url: url })));
          break;
        }
        if (sub === 'deny') {
          const url = rest.slice(1).join(' ').trim();
          if (!url) { sys('usage: /web deny <https://host/path>'); break; }
          sys(renderWebStatus(await api('/api/web/deny', 'POST', { url: url })));
          break;
        }
        if (sub === 'fetch') {
          const url = rest.slice(1).join(' ').trim();
          if (!url) { sys('usage: /web fetch <https://host/path>'); break; }
          const page = await api('/api/web/fetch', 'POST', { url: url });
          sys((page.text || '').slice(0, 2000), (page.url || url) + ' · ' + (page.chars || 0) + ' chars');
          break;
        }
        if (sub === 'search') {
          const q = rest.slice(1).join(' ').trim();
          if (!q) { sys('usage: /web search <query>'); break; }
          const found = await api('/api/web/search', 'POST', { query: q });
          const rows = (found.hits || []).flatMap(h =>
            (h.snippets || []).map(s => [h.url, s]));
          if (!rows.length) {
            sys('no hits on allowlisted pages for: ' + q);
          } else {
            sys(table(rows, ['url', 'snippet']));
          }
          break;
        }
        if (sub === 'inject') {
          const r = await api('/api/web/inject', 'POST');
          sys('last extract will be in the next chat prompt (' + (r.chars || 0) + ' chars)');
          break;
        }
        if (sub === 'forget') {
          await api('/api/web/forget', 'POST');
          sys('cleared injected web extract');
          break;
        }
        sys(renderWebStatus(await api('/api/web')));
        break;
      }

      case 'github': {
        sys('querying agentic GitHub status (subprocess, read-only)…');
        const r = await api('/api/github/status', 'GET', undefined, AGENT_CLI_TIMEOUT_MS);
        sys('ok=' + r.ok + '  label=' + r.label + (r.stdout ? '\n' + r.stdout : '') + (r.stderr ? '\n' + r.stderr : ''));
        break;
      }

      case 'agent': {
        const sub = rest[0] || 'help';
        if (sub === 'checks') {
          const r = await api('/api/agent/checks');
          if (rest.length === 1) {
            sys(table(r.profiles.map(p => [p.name, p.description]), ['profile', 'what it runs']));
          } else if (!pendingAgentRun) {
            sys('nothing staged — start with /agent run before selecting checks');
          } else {
            const requested = rest.slice(1).join(' ').split(/[\s,]+/).filter(Boolean);
            const available = new Set(r.profiles.map(p => p.name));
            const unknown = requested.filter(name => !available.has(name));
            if (unknown.length) {
              sys('unknown profile(s): ' + unknown.join(', ') + '; run /agent checks to list valid names');
            } else {
              pendingAgentRun.checks = requested;
              showPendingAgentRun();
            }
          }
        } else if (sub === 'run') {
          const branch = rest[1] || '';
          const instruction = rest.slice(2).join(' ').trim();
          if (!branch || !instruction) {
            sys('usage: /agent run claude/<topic> <what the agent should do>');
            break;
          }
          pendingAgentRun = {
            branch: branch,
            instruction: instruction,
            commit_message: instruction.slice(0, 72),
            checks: ['pytest'],
            plan: null,
            read_files: [],
          };
          showPendingAgentRun();
          sys('nothing has run yet. Optionally use /agent plan, /agent read, or /agent checks <profile ...>; then authorize with:  /agent confirm <why you are doing this>');
        } else if (sub === 'plan') {
          if (!pendingAgentRun) { sys('nothing staged — start with /agent run'); break; }
          if (rest[1] === 'clear' && rest.length === 2) {
            pendingAgentRun.plan = null;
            sys('staged plan cleared');
            showPendingAgentRun();
          } else if (rest.length > 1) {
            sys('usage: /agent plan  (or /agent plan clear)');
          } else {
            agentPlanInput.click();
          }
        } else if (sub === 'read') {
          if (!pendingAgentRun) { sys('nothing staged — start with /agent run'); break; }
          const path = rest.slice(1).join(' ').trim();
          if (path === 'clear') {
            pendingAgentRun.read_files = [];
            sys('declared read files cleared');
          } else if (!path) {
            sys('usage: /agent read <repo-relative-path>  (or /agent read clear)');
          } else {
            const canonical = canonicalRepoRelativePath(path);
            if (!canonical) {
              sys('refused read path (must be repo-relative: no absolute, .., drive, or flag-like names): ' + path);
            } else if (pendingAgentRun.read_files.includes(canonical)) {
              sys('read path is already declared: ' + canonical);
            } else if (pendingAgentRun.read_files.length >= MAX_AGENT_READ_FILES) {
              sys('at most ' + MAX_AGENT_READ_FILES + ' read paths can be staged; drop one with /agent read clear or confirm with the current list');
            } else {
              pendingAgentRun.read_files.push(canonical);
              sys('declared read path: ' + canonical);
            }
          }
          showPendingAgentRun();
        } else if (sub === 'cancel') {
          pendingAgentRun = null;
          sys('staged run discarded');
        } else if (sub === 'confirm') {
          if (!pendingAgentRun) { sys('nothing staged — start with /agent run'); break; }
          const why = rest.slice(1).join(' ').trim();
          if (!why) { sys('a reason is required: /agent confirm <why you are doing this>'); break; }
          /* Keep the staged proposal until the server accepts the run. Clearing
             first made a 422 (e.g. over-cap read_files) destroy the instruction,
             plan, checks, and paths with no recovery short of re-staging. */
          const stagedRun = pendingAgentRun;
          const body = Object.assign({}, stagedRun, { reason: why, confirm: true });
          sendBtn.disabled = true;
          sys('cloning, planning, patching and verifying — this blocks until the run finishes (server cap 60 minutes)…');
          try {
            const rec = agentRecord(await api('/api/agent/run', 'POST', body, AGENT_RUN_TIMEOUT_MS));
            /* agentRecord() returns null (not a throw) on ok=false or an
               unparsed response, so only clear the staged run once a real
               record confirms the server actually accepted it. */
            if (rec) {
              if (pendingAgentRun === stagedRun) pendingAgentRun = null;
              showAgentRecord(rec);
            }
          } catch (err) {
            if (pendingAgentRun === null || pendingAgentRun === stagedRun) {
              pendingAgentRun = stagedRun;
            }
            sys('confirm failed — staged run kept. Fix the request or /agent cancel. (' + err.message + ')');
            showPendingAgentRun();
          } finally {
            sendBtn.disabled = false;
          }
        } else if (sub === 'status' || sub === 'approve' || sub === 'reject') {
          const id = (rest[1] || '').trim();
          if (!id) { sys('usage: /agent ' + sub + ' <run id>'); break; }
          let r;
          if (sub === 'status') {
            r = await api('/api/agent/runs/' + encodeURIComponent(id), 'GET', undefined, AGENT_CLI_TIMEOUT_MS);
          } else {
            r = await api('/api/agent/runs/' + encodeURIComponent(id) + '/decision', 'POST', { decision: sub }, AGENT_CLI_TIMEOUT_MS);
          }
          const rec = agentRecord(r);
          if (rec) showAgentRecord(rec);
        } else if (sub === 'push') {
          const id = (rest[1] || '').trim();
          if (!id) { sys('usage: /agent push <run id>'); break; }
          const rec = agentRecord(await api('/api/agent/runs/' + encodeURIComponent(id) + '/push', 'POST', {}, AGENT_CLI_TIMEOUT_MS));
          if (rec) showAgentRecord(rec);
        } else if (sub === 'discard') {
          const id = (rest[1] || '').trim();
          if (!id) { sys('usage: /agent discard <run id>'); break; }
          const rec = agentRecord(await api('/api/agent/runs/' + encodeURIComponent(id) + '/discard', 'POST', {}, AGENT_CLI_TIMEOUT_MS));
          if (rec) showAgentRecord(rec);
        } else if (sub === 'publish') {
          const id = (rest[1] || '').trim();
          const why = rest.slice(2).join(' ').trim();
          if (!id || !why) { sys('usage: /agent publish <run id> <why you are opening this PR>'); break; }
          const rec = agentRecord(await api(
            '/api/agent/runs/' + encodeURIComponent(id) + '/publish', 'POST', { reason: why, confirm: true },
            AGENT_CLI_TIMEOUT_MS,
          ));
          if (rec) showAgentRecord(rec);
        } else {
          sys(table([
            ['/agent run claude/<topic> <task>', 'stage a run (sends nothing)'],
            ['/agent plan [clear]', 'load or clear a reviewed local plan for the staged run'],
            ['/agent read <repo-relative-path>', 'declare an existing file for the staged coder context'],
            ['/agent read clear', 'clear declared read paths'],
            ['/agent checks [profile ...]', 'list or choose allow-listed verification profiles'],
            ['/agent confirm <reason>', 'authorize and start the staged run'],
            ['/agent cancel', 'discard the staged run'],
            ['/agent status <run id>', 'read a run record'],
            ['/agent approve <run id>', 'commit the pending change'],
            ['/agent reject <run id>', 'discard the pending change'],
            ['/agent push <run id>', 'push an approved branch to origin (disarmed by default)'],
            ['/agent publish <run id> <why>', 'open a draft PR for a pushed run (disarmed by default)'],
            ['/agent discard <run id>', 'reclaim the clone of a decided run from disk'],
          ], ['command', 'action']));
        }
        break;
      }

      case 'harness': {
        const r = await api('/api/harness/runs');
        if (!r.count) { sys('no harness optimizer runs yet'); break; }
        sys(table(r.runs.map(x => [x.run_id]), ['run']));
        break;
      }

      case 'goal': {
        if (!arg) {
          if (!currentSession) { sys('no active session — no goal'); break; }
          const shown = await api('/api/sessions/' + encodeURIComponent(currentSession));
          sessionGoal = typeof shown.goal === 'string' ? shown.goal : '';
          paintGoalLoop();
          sys(sessionGoal ? ('current goal:\n' + sessionGoal) : 'no goal set');
          break;
        }
        if (arg === 'clear') {
          if (!currentSession) { sys('no active session — nothing to clear'); break; }
          const cleared = await api('/api/sessions/' + encodeURIComponent(currentSession) + '/goal', 'POST', { goal: '' });
          sessionGoal = cleared.goal || '';
          paintGoalLoop();
          sys('goal cleared');
          break;
        }
        if (arg.length > MAX_GOAL_CHARS) {
          sys('goal is too long; keep it under ' + MAX_GOAL_CHARS + ' characters');
          break;
        }
        if (!currentSession) {
          const created = await api('/api/sessions', 'POST', { title: arg.slice(0, 40) });
          currentSession = created.session_id;
          $('sSession').textContent = currentSession;
        }
        const set = await api('/api/sessions/' + encodeURIComponent(currentSession) + '/goal', 'POST', { goal: arg });
        sessionGoal = set.goal || '';
        paintGoalLoop();
        sys('goal set:\n' + sessionGoal);
        await refreshSessions();
        break;
      }

      case 'loop': {
        const sub = rest[0] || '';
        if (sub === 'stop') {
          requestLoopStop('loop stopped');
          break;
        }
        if (sub === 'auto') {
          loopAuto = !loopAuto;
          if (loopState) loopState.auto = loopAuto;
          paintGoalLoop();
          sys('loop auto-continue is ' + (loopAuto
            ? 'ON (continues until GOAL_DONE, stall, budget, or rate limit; still chat-only)'
            : 'OFF (one turn, then wait)'));
          break;
        }
        if (loopState && loopState.running) {
          sys('a loop turn is already in flight — /loop stop to abort after it returns');
          break;
        }
        if (!sessionGoal && currentSession) {
          const loaded = await api('/api/sessions/' + encodeURIComponent(currentSession));
          sessionGoal = typeof loaded.goal === 'string' ? loaded.goal : '';
          paintGoalLoop();
        }
        if (!sessionGoal) { sys('set a goal first: /goal <what you want done>'); break; }
        if (sub) {
          const parsed = parseInt(sub, 10);
          if (!/^[1-9]\d*$/.test(sub) || parsed < 1) {
            sys('usage: /loop [n] | /loop stop | /loop auto');
            break;
          }
          const n = Math.min(parsed, MAX_LOOP_TURNS);
          loopState = {
            remaining: n, total: n, auto: loopAuto, stop: false,
            running: false, failures: 0, lastReply: '', completionTokens: 0,
          };
          sys('loop ' + n + ' turn(s) toward the session goal. Chat only — never starts a real-repo run.');
        } else if (!loopState || loopState.remaining <= 0) {
          loopState = {
            remaining: DEFAULT_LOOP_TURNS, total: DEFAULT_LOOP_TURNS,
            auto: loopAuto, stop: false, running: false, failures: 0,
            lastReply: '', completionTokens: 0,
          };
          sys('loop ' + DEFAULT_LOOP_TURNS + ' turn(s) toward the session goal. Chat only — never starts a real-repo run.');
        }
        paintGoalLoop();
        await runLoopTurns();
        break;
      }

      case 'tokens': {
        if (!currentSession) { sys('no active session'); break; }
        const s = await api('/api/sessions/' + encodeURIComponent(currentSession));
        sys(table([['prompt tokens', String(s.tokens.prompt_tokens)],
                   ['completion tokens', String(s.tokens.completion_tokens)],
                   ['total', String(s.tokens.total)],
                   ['exchanges', String(s.tokens.exchanges)]]));
        break;
      }

      case 'status': {
        const s = await api('/api/status');
        sys(table([['version', s.version], ['model', s.model || '(unset)'], ['provider', s.provider],
                   ['soul', s.soul_enabled ? 'on' : 'off'],
                   ['memory', s.memory_enabled ? 'on' : 'off'],
                   ['sessions', String(s.sessions)],
                   ['total tokens', String(s.total_tokens)], ['home', s.home],
                   ['goal', sessionGoal || '(none)'],
                   ['loop', loopState ? ((loopState.auto ? 'auto ' : '') + (loopState.total - loopState.remaining) + '/' + loopState.total) : (loopAuto ? 'auto' : 'off')]]));
        break;
      }

      case 'users': {
        document.querySelectorAll('.side-tab').forEach(t => t.classList.toggle('active', t.dataset.pane === 'users'));
        document.querySelectorAll('.side-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-users'));
        if (window.CyClawAuthAdmin) {
          window.CyClawAuthAdmin.render(document.getElementById('usersPanelBody'), {
            base: '/api/auth',
            actorRole: window.__cyclawRole || 'operator',
            getCsrf: function () {
              const m = document.querySelector('meta[name="csrf-token"]');
              return m ? m.getAttribute('content') : '';
            },
            fetchFn: function (path, init) { return fetchWithTimeout(path, init || {}, 15000); },
            onStatus: function (msg) {
              const el = document.getElementById('usersPanelStatus');
              if (!el) return;
              if (msg) {
                el.textContent = msg;
                el.hidden = false;
              } else {
                el.textContent = '';
                el.hidden = true;
              }
            },
          });
          sys('users panel opened — same accounts as the gate console');
        } else {
          /* auth_admin.js defines the renderer; if it did not load there is
             nothing to render, so say that instead of reporting success over
             an empty pane. */
          const el = document.getElementById('usersPanelStatus');
          if (el) {
            el.textContent = 'users panel unavailable — /static/auth_admin.js did not load';
            el.hidden = false;
          }
          sys('users panel unavailable — /static/auth_admin.js did not load');
        }
        break;
      }
      case 'clear':
        stream.textContent = '';
        /* the staged proposal was only ever visible in the stream it just
           wiped, so leaving it armed would let a later /agent confirm
           authorize a run the operator can no longer see */
        pendingAgentRun = null;
        loopState = null;
        paintGoalLoop();
        break;

      default:
        sys('unknown command: /' + cmd + ' — try /help');
    }
  } catch (e) {
    sys('error: ' + e.message);
  }
}

/* ── chat ── */
function replyHasGoalDone(text) {
  if (typeof text !== 'string' || !text) return false;
  return text.split(/\r?\n/).some(function (line) { return line.trim() === 'GOAL_DONE'; });
}

function sleepMs(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

function stopLoop(reason) {
  if (loopState) loopState.stop = true;
  loopState = null;
  paintGoalLoop();
  if (reason) sys(reason);
}

async function runLoopTurns() {
  if (!loopState || loopState.running) return;
  loopState.running = true;
  paintGoalLoop();
  try {
    while (loopState && !loopState.stop && loopState.remaining > 0) {
      const turn = loopState.total - loopState.remaining + 1;
      const framed = 'Continue toward the session goal. Be concise (local 27b). If the goal is fully satisfied, end with GOAL_DONE on its own line. Stay in this chat; do not request a real-repo write.';
      const reply = await sendChat(framed, true);
      if (!loopState || loopState.stop) {
        stopLoop(loopState && loopState.stop ? 'loop stop honored' : '');
        return;
      }
      if (reply === null) {
        loopState.failures += 1;
        if (loopState.failures >= MAX_LOOP_FAILURES) {
          stopLoop('loop aborted — ' + MAX_LOOP_FAILURES + ' consecutive chat failures');
          return;
        }
        sys('loop turn failed (' + loopState.failures + '/' + MAX_LOOP_FAILURES + ') — /loop to retry, /loop stop to abort');
        return;
      }
      loopState.failures = 0;
      loopState.remaining -= 1;
      if (loopState.lastReply && reply.trim() === loopState.lastReply) {
        stopLoop('loop stopped — model repeated the previous reply (stall)');
        return;
      }
      loopState.lastReply = reply.trim();
      if (replyHasGoalDone(reply)) {
        stopLoop('model signaled GOAL_DONE — loop stopped');
        return;
      }
      if (loopState.completionTokens >= MAX_LOOP_TOTAL_COMPLETION_TOKENS) {
        stopLoop('loop aggregate token budget exhausted (' + loopState.completionTokens + ' total completion tokens)');
        return;
      }
      if (loopState.remaining <= 0) {
        stopLoop('loop budget exhausted (' + loopState.total + ' turn(s))');
        return;
      }
      paintGoalLoop();
      if (!loopState.auto) {
        sys('turn ' + turn + '/' + loopState.total + ' done. /loop to continue, /loop stop to abort, /loop auto then /loop to run the rest.');
        return;
      }
      sys('auto-continue in ' + (LOOP_COOLDOWN_MS / 1000) + 's — /loop stop to abort');
      await sleepMs(LOOP_COOLDOWN_MS);
    }
  } finally {
    if (loopState) loopState.running = false;
    paintGoalLoop();
  }
}

function requestLoopStop(reason) {
  if (loopState) loopState.stop = true;
  if (inflightChat) {
    try { inflightChat.abort(); } catch (e) { /* already finished */ }
  }
  api('/api/chat/cancel', 'POST').catch(function () { /* best-effort Metal release */ });
  stopLoop(reason);
}

async function sendChat(text, asLoop) {
  user(text);
  sendBtn.disabled = true;
  inflightChat = new AbortController();
  const body = { message: text, session_id: currentSession };
  if (asLoop) body.loop = true;
  try {
    const r = await api('/api/chat', 'POST', body);
    currentSession = r.session_id;
    $('sSession').textContent = currentSession;
    if (loopState && r.usage) {
      loopState.completionTokens += Number(r.usage.completion_tokens) || 0;
    }
    agent(r.reply, r.model + ' · +' + r.usage.prompt_tokens + '/' + r.usage.completion_tokens +
          ' tok · session total ' + r.tally.total);
    await refreshStatus();
    await refreshSessions();
    return r.reply;
  } catch (e) {
    if (e && e.name === 'AbortError') return null;
    const code = e && e.code ? e.code : '';
    const wait = e && e.retryAfter ? e.retryAfter : 0;
    if (asLoop && loopState && (code === 'LOOP_RATE_LIMIT' || code === 'RATE_LIMIT') && wait > 0 && wait <= LOOP_RETRY_CAP_SEC && loopState.auto && !loopState.stop) {
      sys('rate limited (' + code + ') — waiting ' + wait + 's then retrying this turn');
      await sleepMs(wait * 1000);
      if (!loopState || loopState.stop) return null;
      try {
        const retry = await api('/api/chat', 'POST', body);
        currentSession = retry.session_id;
        $('sSession').textContent = currentSession;
        if (loopState && retry.usage) {
          loopState.completionTokens += Number(retry.usage.completion_tokens) || 0;
        }
        agent(retry.reply, retry.model + ' · +' + retry.usage.prompt_tokens + '/' + retry.usage.completion_tokens +
              ' tok · session total ' + retry.tally.total);
        await refreshStatus();
        await refreshSessions();
        return retry.reply;
      } catch (e2) {
        if (e2 && e2.name === 'AbortError') return null;
        sys('error: ' + e2.message);
        stopLoop('loop stopped — ' + ((e2 && e2.code) || code));
        return null;
      }
    }
    if (asLoop && (code === 'LOOP_RATE_LIMIT' || code === 'RATE_LIMIT' || code === 'LOOP_IN_FLIGHT' || code === 'CHAT_BUSY')) {
      sys('error: ' + e.message);
      stopLoop('loop stopped — ' + code);
      return null;
    }
    sys('error: ' + e.message);
    return null;
  } finally {
    inflightChat = null;
    sendBtn.disabled = false;
    input.focus();
  }
}

function isLoopStopCommand(text) {
  /* Normalize before the in-flight gate, mirroring runSlash(): case
     insensitive, collapses extra whitespace, and ignores trailing text. */
  if (!text || text.charAt(0) !== '/') return false;
  const parts = text.slice(1).split(/\s+/).filter(Boolean);
  return parts.length >= 2 && parts[0].toLowerCase() === 'loop' && parts[1].toLowerCase() === 'stop';
}

async function onSend() {
  /* sendBtn.disabled is the console's existing in-flight signal (see
     sendChat and /agent confirm above); the Enter-key handler below calls
     onSend() directly and bypasses the button's own disabled state, so a
     second Enter during a blocking /agent confirm launched a concurrent
     clone/model/verification run for the same staged proposal.
     /loop stop is the exception: it must be accepted while a 27b turn is
     in flight so the operator can halt auto-continue. */
  const text = input.value.trim();
  if (!text) return;
  if (sendBtn.disabled) {
    if (isLoopStopCommand(text)) {
      input.value = '';
      requestLoopStop('loop stop requested — aborting the in-flight turn');
    }
    return;
  }
  input.value = '';
  if (text.startsWith('/')) { await runSlash(text); } else { await sendChat(text, false); }
}

/* ── wiring ── */
sendBtn.addEventListener('click', onSend);
input.addEventListener('keydown', e => {
  // Ignore Enter while an IME composition is in progress; sending on the
  // commit keystroke submits a half-typed query.
  if (e.isComposing) return;
  if (e.key === 'Enter') onSend();
});
document.querySelectorAll('.side-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.side-pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $('pane-' + tab.dataset.pane).classList.add('active');
    if (tab.dataset.pane === 'users') runSlash('/users');
  });
});
const hAuthLogin = document.getElementById('hAuthLogin');
const hAuthLoginBox = document.getElementById('hAuthLoginBox');
const hAuthSetup = document.getElementById('hAuthSetup');
const hAuthLogout = document.getElementById('hAuthLogout');
function setHarnessLogoutVisible(on) {
  if (hAuthLogout) hAuthLogout.hidden = !on;
}
/* Both probes are bounded, matching terminal.js's refreshAuthUi. The catch
   below deliberately keeps the last-known UI on failure, but a bare fetch
   against a gateway that accepted the socket and then stalled never settles,
   so that catch would never run and the auth panel would stay blank for the
   life of the page. 5000ms mirrors the terminal console's budget for the same
   two endpoints. */
async function refreshHarnessAuth() {
  const who = document.getElementById('hAuthWho');
  try {
    const me = await fetchWithTimeout('/api/auth/whoami', {}, 5000);
    if (me.status === 503) {
      if (hAuthSetup) hAuthSetup.hidden = true;
      if (hAuthLoginBox) hAuthLoginBox.hidden = true;
      setHarnessLogoutVisible(false);
      if (who) who.textContent = '';
      return;
    }
    if (me.ok) {
      const data = await me.json();
      window.__cyclawRole = data.role;
      if (hAuthSetup) hAuthSetup.hidden = true;
      if (hAuthLoginBox) hAuthLoginBox.hidden = true;
      setHarnessLogoutVisible(true);
      if (who) who.textContent = data.username + ' · ' + data.role;
      return;
    }
    const setup = await fetchWithTimeout('/api/auth/setup-status', {}, 5000);
    if (setup.ok) {
      const status = await setup.json();
      if (status.needs_password) {
        if (hAuthSetup) hAuthSetup.hidden = false;
        if (hAuthLoginBox) hAuthLoginBox.hidden = true;
        setHarnessLogoutVisible(false);
        return;
      }
    }
    if (hAuthSetup) hAuthSetup.hidden = true;
    if (hAuthLoginBox) hAuthLoginBox.hidden = false;
    window.__cyclawRole = null;
    if (who) who.textContent = '';
    setHarnessLogoutVisible(false);
  } catch (e) { /* keep last UI */ }
}
if (hAuthLogin) {
  hAuthLogin.addEventListener('click', async function () {
    const user = document.getElementById('hAuthUser');
    const pass = document.getElementById('hAuthPass');
    const who = document.getElementById('hAuthWho');
    try {
      const r = await fetchWithTimeout('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user.value.trim(), password: pass.value }),
      }, 15000);
      pass.value = '';
      if (!r.ok) { if (who) who.textContent = 'login failed'; return; }
      const data = await r.json();
      window.__cyclawRole = data.role;
      if (who) who.textContent = data.username + ' · ' + data.role;
      if (hAuthSetup) hAuthSetup.hidden = true;
      if (hAuthLoginBox) hAuthLoginBox.hidden = true;
      setHarnessLogoutVisible(true);
    } catch (e) {
      pass.value = '';
      if (who) who.textContent = 'network error: login failed';
    }
  });
}
if (hAuthLogout) {
  hAuthLogout.addEventListener('click', async function () {
    const headers = { 'Content-Type': 'application/json' };
    if (CSRF_TOKEN) headers['X-CyClaw-CSRF'] = CSRF_TOKEN;
    try {
      const response = await fetchWithTimeout('/api/auth/logout', { method: 'POST', headers: headers }, 15000);
      if (!response.ok) {
        const who = document.getElementById('hAuthWho');
        if (who) who.textContent = 'logout rejected (' + response.status + ')';
        return;
      }
    } catch (e) { /* best-effort; refresh below paints whatever session remains */ }
    await refreshHarnessAuth();
  });
}
const hAuthSetupBtn = document.getElementById('hAuthSetupBtn');
if (hAuthSetupBtn) {
  hAuthSetupBtn.addEventListener('click', async function () {
    const p1 = document.getElementById('hAuthSetupPass');
    const p2 = document.getElementById('hAuthSetupPass2');
    const who = document.getElementById('hAuthWho');
    const password = p1 ? p1.value : '';
    const confirm = p2 ? p2.value : '';
    if (p1) p1.value = '';
    if (p2) p2.value = '';
    if (password !== confirm) { if (who) who.textContent = 'passwords do not match'; return; }
    try {
      const r = await fetchWithTimeout('/api/auth/bootstrap-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      }, 15000);
      if (!r.ok) { if (who) who.textContent = 'could not set password'; return; }
      const data = await r.json();
      window.__cyclawRole = data.role;
      if (who) who.textContent = data.username + ' · ' + data.role;
      if (hAuthSetup) hAuthSetup.hidden = true;
      if (hAuthLoginBox) hAuthLoginBox.hidden = true;
      setHarnessLogoutVisible(true);
    } catch (e) {
      if (who) who.textContent = 'network error: could not set password';
    }
  });
}
refreshHarnessAuth();
$('sSoul').addEventListener('click', () => runSlash('/soul ' + (soulEnabled ? 'off' : 'on')));
$('sMemory').addEventListener('click', () => runSlash('/memory ' + (memoryEnabled ? 'off' : 'on')));

buildCommands();
refreshStatus();
refreshSessions().catch(() => {});
refreshRegistry().catch(() => {});
sys('CyClaw harness — local coding console (PowerShell launcher: cyclaw).');
sys('System prompt: ponytail + karpathy-guidelines discipline contracts for agentic GitHub coding.');
sys('Type /help for commands. /skills and /tools list wired surfaces. /web is allowlist-only and off by default. /goal + /loop are chat-only (rate-limited for local 27b).');
input.focus();
paintGoalLoop();
</script>
</body>
</html>
